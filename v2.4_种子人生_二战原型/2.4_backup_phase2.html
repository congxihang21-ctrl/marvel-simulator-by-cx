<!-- ============================================================
     四端适配优化版 · viewport 组合拳
     1. width=device-width: 基础
     2. initial-scale=1.0 + maximum-scale=1.0 + user-scalable=no: 禁双指缩放（抖音投放必选）
     3. viewport-fit=cover: 刘海屏/灵动岛沉浸式（iOS/鸿蒙）
     4. 加 viewport-fit 后须用 env(safe-area-inset-*) 避让
============================================================ -->

<script>
/* 面板去重精简 + 人际关系数值化（好感/信任/敌意 0-100）+ 电脑端滚轮修复 + 四端适配：iOS / 鸿蒙 / 安卓 X5 / Win Edge
   在 CSS 之前跑一丢丢 JS：给 :root 注入 --vh / --sat / --sab 三个"真·视口尺寸"变量。
   为什么要在 CSS 前跑？因为 100dvh 在 iOS17 Beta + WebView 某些组合下仍会被地址栏高度带偏，
   而 visualViewport.height 才是"真实的、排除了工具栏/键盘的可见高度"。
   safe-area 也顺手通过 JS 拉一次，作为 CSS env() 的兜底（鸿蒙/部分安卓没有 env() 实现）。*/
(function(){try{
  var r=document.documentElement;
  var setV=function(){
    try{
      var w=window, vv=w.visualViewport;
      var vh = vv && vv.height ? vv.height : (w.innerHeight||r.clientHeight||screen.height||667);
      var vw = vv && vv.width  ? vv.width  : (w.innerWidth ||r.clientWidth ||screen.width ||375);
      r.style.setProperty('--vh',(vh*0.01).toFixed(3)+'px');
      r.style.setProperty('--dvh',(vh*0.01).toFixed(3)+'px');
      r.style.setProperty('--vw',(vw*0.01).toFixed(3)+'px');
      /* safe-area：优先 CSS env()，拿不到就用 getComputedStyle 反推 */
      try{
        var st=getComputedStyle(r);
        var sat=parseFloat(st.getPropertyValue('--sat')||'0')||0;
        var sab=parseFloat(st.getPropertyValue('--sab')||'0')||0;
        if(!sat||!sab){
          // 用一个临时元素去读 env()，因为 CSS 变量不会自己展开 env()
          var t=document.createElement('div');
          t.style.cssText='position:fixed;visibility:hidden;pointer-events:none;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);left:-9999px;top:-9999px;width:1px;height:1px';
          document.head.appendChild(t);
          var cs=getComputedStyle(t);
          r.style.setProperty('--sat',parseFloat(cs.paddingTop||'0')+'px');
          r.style.setProperty('--sab',parseFloat(cs.paddingBottom||'0')+'px');
          t.remove();
        }
      }catch(_){}
    }catch(_){}
  };
  setV();
  var evs=['resize','orientationchange','load','pageshow','scroll'];
  if(window.visualViewport){window.visualViewport.addEventListener('resize',setV);window.visualViewport.addEventListener('scroll',setV)}
  for(var i=0;i<evs.length;i++){window.addEventListener(evs[i],setV,{passive:true})}
  setTimeout(setV,80);setTimeout(setV,500);
}catch(_){}
})();
/* iOS 17 Beta pageshow 兜底：用户从 bfcache（前进/后退缓存）回来时，_boot 可能不会再跑，
   所以我们在 window 上埋一个全局标记，pageshow.persisted=true 时强制重跑。后续 _boot 里会读它。*/
window._MCU_FIXED_VH = true;
</script>

<!-- ================= v1.8 · 华为/旧版浏览器兼容 polyfill（在 body 前、主脚本前执行） ================= -->
<script>
/* 防御：华为默认浏览器（华为浏览器/Quark 内核）可能缺少部分 ES2017+ API，
   页面白屏大多是因为某行代码用了不支持的 API 直接报错，后续脚本全挂。
   这里在最前面补齐 polyfill，保证主脚本能跑完。 */
(function(){
  try{
    /* Promise.allSettled：离线目标启发式里用到了 */
    if(!Promise.allSettled){
      Promise.allSettled=function(arr){
        return Promise.all((arr||[]).map(function(p){
          return Promise.resolve(p).then(function(v){return{status:'fulfilled',value:v}},
          function(r){return{status:'rejected',reason:r}})
        }))
      }
    }
    /* Array.prototype.flat / flatMap */
    if(!Array.prototype.flat){
      Array.prototype.flat=function(d){
        d=d===undefined?1:d;var r=[];(function f(a,dep){
          for(var i=0;i<a.length;i++){
            if(Array.isArray(a[i])&&dep<d)f(a[i],dep+1);else r.push(a[i])
          }
        })(this,0);return r
      }
    }
    if(!Array.prototype.flatMap){
      Array.prototype.flatMap=function(cb){return Array.prototype.flat.call(this.map(cb),1)}
    }
    /* String.prototype.padStart */
    if(!String.prototype.padStart){
      String.prototype.padStart=function(t,s){
        s=s||' ';t=t|0;var str=String(this);
        while(str.length<t)str=s+str;return str.slice(0,t)
      }
    }
    /* Object.assign 兜底（极旧内核） */
    if(!Object.assign){
      Object.assign=function(t){
        t=t||{};for(var i=1;i<arguments.length;i++){
          var s=arguments[i];if(s)for(var k in s){if(Object.prototype.hasOwnProperty.call(s,k))t[k]=s[k]}
        }return t
      }
    }
    /* Number.isNaN */
    if(!Number.isNaN){
      Number.isNaN=function(v){return typeof v==='number'&&isNaN(v)}
    }
    /* requestAnimationFrame 兜底（极旧内核） */
    if(!window.requestAnimationFrame){
      window.requestAnimationFrame=function(cb){return setTimeout(cb,16)}
      window.cancelAnimationFrame=function(id){clearTimeout(id)}
    }
    /* visualViewport 兜底：华为某些内核没有，用 innerHeight 代替 */
    if(!window.visualViewport){
      window.visualViewport={height:window.innerHeight||667,width:window.innerWidth||375,
        addEventListener:function(){},removeEventListener:function(){}}
    }
    /* fetch 兜底：用 XMLHttpRequest 模拟一个最简版 */
    if(!window.fetch){
      window.fetch=function(url,opts){
        opts=opts||{};
        return new Promise(function(resolve,reject){
          var xhr=new XMLHttpRequest();
          xhr.open(opts.method||'GET',url,true);
          var hs=opts.headers||{};for(var k in hs){if(hs[k])xhr.setRequestHeader(k,hs[k])}
          xhr.responseType='text';
          xhr.onload=function(){
            resolve({ok:xhr.status>=200&&xhr.status<300,status:xhr.status,
              text:function(){return Promise.resolve(xhr.responseText)},
              json:function(){return Promise.resolve(JSON.parse(xhr.responseText))},
              body:null})
          };
          xhr.onerror=function(){reject(new Error('Network error'))};
          xhr.ontimeout=function(){reject(new Error('Timeout'))};
          xhr.send(opts.body||null)
        })
      }
    }
    /* TextDecoder 兜底：极旧内核没有，用纯 JS decode */
    if(typeof TextDecoder==='undefined'){
      window.TextDecoder=function(){
        this.decode=function(buf){
          var s='', i;
          if(buf){ for(i=0;i<buf.length;i++){ s+=String.fromCharCode(buf[i]); } }
          try{ return decodeURIComponent(escape(s)); }catch(e){ return s; }
        };
        return this;
      };
    }
    /* AbortController 兜底 */
    if(typeof AbortController==='undefined'){
      window.AbortController=function(){this.signal={aborted:false};this.abort=function(){this.signal.aborted=true}}
    }
  }catch(_){}
})();
</script>

  createSeed(){

    const gender = document.getElementById("charGender").value;
    const age = parseInt(document.getElementById("charAge").value)||20;
    if(!Game.selectedOrigin){ this.toast("请先选择出身"); return; }
    const origin = SEEDS[Game.selectedOrigin];
    if(!origin){ this.toast("出身数据缺失"); return; }
    const eraStart = {ww2:1943,coldwar:1960,heroage:2008,newyork:2012,ultron:2015,civilwar:2016,infinity:2018,multiverse:2024};
    const startYear = eraStart[Game.selectedEra]||1943;
    const seed = "CX-"+startYear+"-"+Math.floor(Math.random()*90000+10000);
    const stats = JSON.parse(JSON.stringify(origin.stats));
    this.state = {
      seed, name, gender, age,
      origin:Game.selectedOrigin,
      originName:origin.name,
      era:Game.selectedEra,
      stats, ovr:calcOvr(stats),
      date:{year:startYear,month:3,day:17},
      location:"美国",
      faction:"平民",
      money:50, stress:0,
      inventory:[],
      relations:{family:{favor:60,trust:50,hostility:0}},
      flags:{eventCount:0,dailyCount:0,noInjure:0},
      timeline:[],
      achievements:[],
      ending:null,
      currentNode:origin.start,
    };
    document.getElementById("seedCode").textContent = seed;
    document.getElementById("seedInfo").innerHTML = `${name} · ${gender} · ${age}岁<br>${origin.name}<br>OVR ${this.state.ovr}`;
    UI.showPage("seed");
  },
  
  start(){
    UI.showPage("game");
    this.renderNode();
  },
  
  renderNode(){
    const s = this.state;
    const node = NODES[s.currentNode];
    if(!node){ this.toast("节点缺失："+s.currentNode); return; }
    s.flags.eventCount++;
    if(node.level==="日常") s.flags.dailyCount++;
    // 记录时间轴
    s.timeline.push({date:`${s.date.year}年${s.date.month}月`, text:node.title});
    if(s.timeline.length>100) s.timeline.shift();
    document.getElementById("topName").textContent = s.name;
    document.getElementById("topAge").textContent = s.age+"岁";
    document.getElementById("topDate").textContent = `${s.date.year}年${s.date.month}月`;
    document.getElementById("topLoc").textContent = s.location;
    document.getElementById("ovrBadge").innerHTML = s.ovr+"<small>OVR</small>";
    // 状态模块条
    const inj = s.flags.injuredCount||0;
    const hEl = document.getElementById("chipHealth");
    hEl.textContent = inj>0?(inj>2?"重伤":"受伤"):"健康";
    hEl.className = "sc-value "+(inj>2?"stress-high":inj>0?"stress-mid":"health");
    const stEl = document.getElementById("chipStress");
    stEl.textContent = s.stress;
    stEl.className = "sc-value "+(s.stress>70?"stress-high":s.stress>40?"stress-mid":"stress-low");
    document.getElementById("chipMoney").textContent = "$"+s.money;
    document.getElementById("chipFaction").textContent = s.faction||"平民";
    // 事件卡
    document.getElementById("eventTitle").textContent = node.title;
    document.getElementById("eventText").textContent = node.text;
    document.getElementById("eventDate").textContent = `${s.date.year}.${String(s.date.month).padStart(2,'0')}`;
    const lv = document.getElementById("eventLevel");
    lv.textContent = node.level||"日常";
    lv.className = "event-level-badge "+(node.level==="英雄"?"lv-hero":node.level==="世界"?"lv-world":node.level==="人生"?"lv-life":"");
    document.getElementById("eventCard").className = "event-card "+(node.level==="世界"?"world":node.level==="英雄"?"hero":"");
    // 选项
    const choices = document.getElementById("choices");
    choices.innerHTML = "";
    node.choices.forEach((c,i)=>{
      const div = document.createElement("div");
      div.className = "choice glass-shine";
      let meta = "";
      if(c.check && c.base!==undefined){
        const chance = this.calcChance(c.base, c.check);
        const risk = chance>70?"low":chance>40?"mid":"high";
        const riskLabel = risk==="low"?"低风险":risk==="mid"?"中风险":"高风险";
        meta = `<div class="choice-meta"><span class="rate-text">${chance}%</span><div class="rate-bar"><div class="rate-fill" style="width:${chance}%;background:${chance>70?'var(--success)':chance>40?'var(--warning)':'var(--danger)'}"></div></div><span class="risk-tag risk-${risk}">${riskLabel}</span></div>`;
      }
      div.innerHTML = `<div class="choice-label"><span class="choice-letter">${String.fromCharCode(65+i)}</span>${c.label}</div>${meta}`;
      div.onclick = ()=>this.makeChoice(c);
      choices.appendChild(div);
    });
    // AI 自定义选项
    const aiDiv = document.createElement("div");
    aiDiv.className = "choice";
    aiDiv.innerHTML = `<div class="choice-label"><span class="choice-letter" style="background:var(--magic);color:#fff">✨</span>自定义行动</div><div class="choice-meta"><span style="font-size:11px;color:var(--text-3)">用 AI 解析你的想法</span></div>`;
    aiDiv.onclick = ()=>UI.aiCustomOption(node);
    choices.appendChild(aiDiv);
    this.checkAchievements();
  },
  
  makeChoice(choice){
    const s = this.state;
    if(choice.check && choice.base!==undefined){
      const chance = this.calcChance(choice.base, choice.check);
      this.runJudge(chance, choice);
    } else {
      if(choice.effects) this.applyEffects(choice.effects);
      if(choice.next){
        s.currentNode = choice.next;
        if(choice.next.startsWith("ending_")){ this.showEnding(choice.next.replace("ending_","")); return; }
      }
      this.advanceTime();
      this.renderNode();
    }
  },
  
  calcChance(base, stat){
    const s = this.state;
    let v = base + (s.stats[stat]-30)*1.2;
    if(s.flags.injured) v -= 10;
    if(s.stress>70) v -= 8;
    v = Math.max(5, Math.min(95, Math.round(v)));
    return v;
  },
  
  runJudge(chance, choice){
    const ov = document.getElementById("judgeOverlay");
    const rate = document.getElementById("judgeRate");
    const ptr = document.getElementById("judgePointer");
    const res = document.getElementById("judgeResult");
    ov.classList.add("show");
    rate.textContent = chance+"%";
    res.textContent = "";
    let pos = 50, dir = 1, speed = 4;
    const totalTime = 1500 + Math.random()*500;
    const start = Date.now();
    const tick = ()=>{
      pos += dir*speed;
      if(pos>95){pos=95;dir=-1;}
      if(pos<5){pos=5;dir=1;}
      ptr.style.left = pos+"%";
      if(Date.now()-start < totalTime){
        requestAnimationFrame(tick);
      } else {
        const stopPos = Math.random()*100;
        const success = stopPos < chance;
        ptr.style.left = stopPos+"%";
        res.textContent = success?"✓ 成功":"✗ 失败";
        res.style.color = success?"#10b981":"#ef4444";
        setTimeout(()=>{
          ov.classList.remove("show");
          this.resolveChoice(choice, success);
        }, 1200);
      }
    };
    tick();
  },
  
  resolveChoice(choice, success){
    const s = this.state;
    const result = success ? choice.success : choice.fail;
    if(result){
      if(result.effects) this.applyEffects(result.effects);
      if(result.next){
        s.currentNode = result.next;
        if(result.next.startsWith("ending_")){
          this.showEnding(result.next.replace("ending_",""));
          return;
        }
      }
    }
    this.advanceTime();
    this.renderNode();
  },
  
  applyEffects(eff){
    const s = this.state;
    for(let k in eff){
      if(STAT_KEYS.includes(k)){
        s.stats[k] = Math.max(0, Math.min(99, s.stats[k]+eff[k]));
      } else if(k.startsWith("rel_")){
        const n = k.slice(4);
        if(!s.relations[n]) s.relations[n] = {favor:50,trust:30,hostility:0};
        s.relations[n].favor = Math.max(0,Math.min(100,s.relations[n].favor+eff[k]));
      } else if(k.startsWith("flag_")){
        s.flags[k.slice(5)] = true;
      } else if(k==="injured"){
        s.flags.injuredCount = (s.flags.injuredCount||0)+1;
        s.flags.noInjure = 0;
        s.stats.体能 = Math.max(0, s.stats.体能-8);
        s.stats.格斗 = Math.max(0, s.stats.格斗-5);
        s.stress = Math.min(100, s.stress+15);
      } else if(k==="stress"){
        s.stress = Math.max(0, Math.min(100, s.stress+eff[k]));
      } else if(k==="钱"){
        s.money = Math.max(0, s.money+eff[k]);
      }
    }
    s.ovr = calcOvr(s.stats);
    if(!eff.injured) s.flags.noInjure = (s.flags.noInjure||0)+1;
  },
  
  advanceTime(){
    const s = this.state;
    s.date.month++;
    if(s.date.month>12){s.date.month=1;s.date.year++;}
    s.age = s.age + (s.date.month===1?1:0);
    s.stress = Math.max(0, s.stress-2);
    // 伤病恢复
    if(s.flags.injuredCount>0){
      s.stats.体能 = Math.min(99, s.stats.体能+3);
      s.stats.格斗 = Math.min(99, s.stats.格斗+2);
      s.flags.injuredCount--;
      if(s.flags.injuredCount===0) this.toast("伤势已痊愈");
    }
    // 随机彩蛋触发（2%概率）
    if(Math.random()<0.02 && !s.flags.easterEgg1){
      s.flags.easterEgg1 = true;
      this.unlockAchievement("a081");
      s.currentNode = "easter_tesseract";
      this.renderNode();
      return;
    }
    // 军饷
    s.money += 15;
  },
  
  showEnding(id){
    const e = ENDINGS[id]||ENDINGS.ordinary_life;
    const s = this.state;
    s.ending = id;
    const html = `
      <h2 style="color:var(--accent);text-align:center;font-size:24px">${e.name}</h2>
      <div style="text-align:center;color:var(--fg-3);font-size:12px;margin:8px 0">${e.rarity}</div>
      <p style="color:var(--fg-1);line-height:1.8;margin:20px 0">${e.text.replace(/{name}/g,s.name)}</p>
      <div style="border-top:1px solid var(--stroke-1);padding-top:16px;margin-top:16px">
        <div style="font-size:13px;color:var(--fg-2)">人生时长：${s.date.year-1943}年</div>
        <div style="font-size:13px;color:var(--fg-2)">最终 OVR：${s.ovr}</div>
        <div style="font-size:13px;color:var(--fg-2)">解锁成就：${s.achievements.length}</div>
      </div>
      <div style="display:flex;gap:10px;margin-top:20px">
        <button class="btn btn-glass" style="flex:1" onclick="UI.closeModal();UI.goHome()">返回首页</button>
        <button class="btn btn-primary" style="flex:1" onclick="UI.closeModal();Game.saveSlotPrompt()">保存人生</button>
      </div>
    `;
    UI.openModal(html);
    this.unlockAchievementByEnding(id);
    this.saveAchievements();
  },
  
  unlockAchievementByEnding(id){
    const map = {
      captain_america:"a061", serum_fail:"a062", red_skull_victor:"a063",
      kia:"a064", frozen:"a079", hydra:"a078", wakandan_guardian:"a066",
      mutant_legend:"a068",
    };
    if(map[id]) this.unlockAchievement(map[id]);
  },
  
  checkAchievements(){
    const s = this.state;
    ACHIEVEMENTS.forEach(a=>{
      if(!s.achievements.includes(a.id) && !a.hidden && a.check(s)){
        this.unlockAchievement(a.id);
      }
    });
  },
  
  unlockAchievement(id){
    const s = this.state;
    if(!s.achievements.includes(id)){
      s.achievements.push(id);
      const a = ACHIEVEMENTS.find(x=>x.id===id);
      if(a) this.toast(`🏆 成就解锁：${a.name}`);
    }
  },
  
  toast(msg){
    const w = document.getElementById("toastWrap");
    const t = document.createElement("div");
    t.className = "toast";
    t.textContent = msg;
    w.appendChild(t);
    setTimeout(()=>t.remove(), 2500);
  },
  
  saveAchievements(){
    try{
      const all = JSON.parse(localStorage.getItem("mcu_ach_all")||"{}");
      this.state.achievements.forEach(id=>all[id]=true);
      localStorage.setItem("mcu_ach_all", JSON.stringify(all));
    }catch(e){}
  },
  
  loadAchievements(){
    try{ return JSON.parse(localStorage.getItem("mcu_ach_all")||"{}"); }catch(e){ return {}; }
  },
  
  saveSlotPrompt(){
    let html = `<h3 style="color:var(--fg-0)">保存到存档槽</h3>`;
    for(let i=0;i<4;i++){
      const slot = this.getSlot(i);
      html += `<div class="save-slot" onclick="Game.saveToSlot(${i})">
        <div class="save-name">存档槽 ${i+1} ${slot?`· ${slot.name}`:"（空）"}</div>
        ${slot?`<div class="save-meta">${slot.date.year}年 · OVR ${slot.ovr} · ${slot.saveTime}</div>`:""}
      </div>`;
    }
    UI.openModal(html);
  },
  
  saveToSlot(i){
    const s = this.state;
    s.saveTime = new Date().toLocaleString("zh-CN");
    try{
      localStorage.setItem("mcu_save_"+i, JSON.stringify(s));
      this.toast("已保存到存档槽 "+(i+1));
      UI.closeModal();
    }catch(e){ this.toast("保存失败"); }
  },
  
  getSlot(i){
    try{ return JSON.parse(localStorage.getItem("mcu_save_"+i)||"null"); }catch(e){ return null; }
  },
  
  loadSlot(i){
    const s = this.getSlot(i);
    if(!s){ this.toast("存档为空"); return; }
    this.state = s;
    UI.showPage("game");
    this.renderNode();
    UI.closeModal();
  },
};

      for(let n in s.relations){
        const r = s.relations[n];
        html += `<div class="rel-card"><div class="rel-name">${n} <button class="btn" style="padding:4px 8px;font-size:11px;margin-left:8px" onclick="UI.chatWith('${n}')">💬聊天</button></div>
          <div class="rel-bars"><div class="rel-bar"><div class="rel-fill" style="width:${r.favor}%;background:#10b981"></div></div><div class="rel-bar"><div class="rel-fill" style="width:${r.trust}%;background:#3b82f6"></div></div><div class="rel-bar"><div class="rel-fill" style="width:${r.hostility}%;background:#ef4444"></div></div></div>
          <div style="font-size:10px;color:var(--fg-3);margin-top:4px">好感${r.favor} 信任${r.trust} 敌意${r.hostility}</div></div>`;
      }
      if(!html) html = `<div style="color:var(--fg-3)">暂无关系</div>`;
      c.innerHTML = html;
    } else if(this.currentTab==="state"){
      c.innerHTML = `
        <div class="state-row"><span class="k">金钱</span><span class="v">$${s.money}</span></div>
        <div class="state-row"><span class="k">压力</span><span class="v" style="color:${s.stress>70?'#ef4444':s.stress>40?'#f59e0b':'#10b981'}">${s.stress}/100</span></div>
        <div class="state-row"><span class="k">伤病</span><span class="v" style="color:${s.flags.injuredCount>0?'#ef4444':'#10b981'}">${s.flags.injuredCount>0?'受伤中('+s.flags.injuredCount+'月)':'健康'}</span></div>
        <div class="state-row"><span class="k">所在地</span><span class="v">${s.location}</span></div>
        <div class="state-row"><span class="k">出身</span><span class="v">${s.originName}</span></div>
        <div class="state-row"><span class="k">种子</span><span class="v">${s.seed}</span></div>`;
    }
  },
  
  chatWith(npc){
    const s = Game.state;
    const r = s.relations[npc];
    if(!r) return;
    const html = `
      <h3 style="color:var(--fg-0)">💬 ${npc}</h3>
      <div style="font-size:12px;color:var(--fg-3);margin-bottom:12px">好感${r.favor} · 信任${r.trust} · 敌意${r.hostility}</div>
      <div id="chatLog" style="background:var(--bg-2);border-radius:8px;padding:12px;min-height:120px;margin-bottom:12px;font-size:13px;color:var(--fg-1)">${npc}：你来了。今天怎么样？</div>
      <input id="chatInput" placeholder="说点什么..." style="width:100%;padding:10px;background:var(--bg-2);border:1px solid var(--stroke-1);border-radius:8px;color:var(--fg-0);font-family:inherit;box-sizing:border-box">
      <div style="display:flex;gap:8px;margin-top:8px">
        <button class="btn btn-glass" style="flex:1;padding:8px;font-size:12px" onclick="UI.chatQuick('聊聊近况')">聊聊近况</button>
        <button class="btn btn-glass" style="flex:1;padding:8px;font-size:12px" onclick="UI.chatQuick('问问战争')">问问战争</button>
        <button class="btn btn-primary" style="flex:1;padding:8px;font-size:12px" onclick="UI.chatSend()">发送</button>
      </div>`;
    this.openModal(html);
    this._chatNPC = npc;
  },
  
  chatQuick(msg){
    document.getElementById("chatInput").value = msg;
    this.chatSend();
  },
  
  chatSend(){
    const input = document.getElementById("chatInput");
    const msg = input.value.trim();
    if(!msg) return;
    const log = document.getElementById("chatLog");
    const npc = this._chatNPC;
    const s = Game.state;
    log.innerHTML += `<br><br>你：${msg}`;
    input.value = "";
    // AI 回复（模拟）
    setTimeout(()=>{
      const replies = ["嗯，我明白你的意思。","这事儿不好说啊。","你觉得呢？","希望一切都会好起来。","战争总会结束的。","你今天看起来不太一样。"];
      const reply = replies[Math.floor(Math.random()*replies.length)];
      log.innerHTML += `<br><br>${npc}：${reply}`;
      log.scrollTop = log.scrollHeight;
      // 关系变化
      const r = s.relations[npc];
      r.favor = Math.max(0, Math.min(100, r.favor + (Math.random()>0.3?1:-1)));
    }, 600);
  },
  
  aiCustomOption(node){
    const text = prompt("你想怎么做？（描述你的行动）");
    if(!text) return;
    Game.toast("AI 正在解析你的行动...");
    setTimeout(()=>{
      // AI 分类到 A/B/C 之一
      const idx = Math.floor(Math.random()*node.choices.length);
      Game.toast(`AI 判定：最接近选项 ${String.fromCharCode(65+idx)}`);
      Game.makeChoice(node.choices[idx]);
    }, 800);
  },
  
  showTimeline(){
    const s = Game.state;
    let html = `<h3 style="color:var(--fg-0)">人生时间轴</h3>`;
    s.timeline.forEach(t=>{
      html += `<div class="timeline-item"><div class="timeline-date">${t.date}</div><div class="timeline-text">${t.text}</div></div>`;
    });
    if(s.timeline.length===0) html += `<div style="color:var(--fg-3);font-size:13px">你的人生才刚刚开始...</div>`;
    this.openModal(html);
  },
  showRelations(){ this.currentTab="rel"; document.querySelectorAll(".dtab").forEach(d=>d.classList.toggle("active",d.dataset.tab==="rel")); this.toggleSide(); },
  showInventory(){ this.currentTab="equip"; document.querySelectorAll(".dtab").forEach(d=>d.classList.toggle("active",d.dataset.tab==="equip")); this.toggleSide(); },
  showAchievements(){ this.goCodex(); },
  openMenu(){ this.goSettings(); },
  
  openModal(html){
    document.getElementById("modalBody").innerHTML = html;
    document.getElementById("modal").classList.add("show");
  },
  closeModal(){ document.getElementById("modal").classList.remove("show"); },
};

/* ===== 启动 ===== */
window.addEventListener("DOMContentLoaded", ()=>{ UI.initTheme(); Game.init(); });
</script>
<script src="js/eras.js"></script>
</body>
</html>
