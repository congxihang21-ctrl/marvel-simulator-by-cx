<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<!-- ============================================================
     四端适配优化版 · viewport 组合拳
     1. width=device-width: 基础
     2. initial-scale=1.0 + maximum-scale=1.0 + user-scalable=no: 禁双指缩放（抖音投放必选）
     3. viewport-fit=cover: 刘海屏/灵动岛沉浸式（iOS/鸿蒙）
     4. 加 viewport-fit 后须用 env(safe-area-inset-*) 避让
============================================================ -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="format-detection" content="telephone=no,email=no,address=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-touch-fullscreen" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="漫威模拟器">
<meta name="theme-color" content="#080b10">
<!-- 鸿蒙/安卓 全屏沉浸模式 -->
<meta name="color-scheme" content="dark">
<meta name="screen-orientation" content="portrait">
<meta name="x5-orientation" content="portrait">
<meta name="x5-fullscreen" content="true">
<meta name="x5-page-mode" content="app">
<meta name="full-screen" content="yes">
<meta name="browsermode" content="application">
<!-- 禁止 IE 兼容模式 -->
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>漫威电影宇宙 · 英雄纪元 · 人生模拟器 Beta v2.3（抖音公测版）</title>
<script>
/* 面板去重精简 + 人际关系数值化（好感/信任/敌意 0-100）+ 电脑端滚轮修复 + 四端适配：iOS / 鸿蒙 / 安卓 X5 / Win Edge
   在 CSS 之前跑一丢丢 JS：给 :root 注入 --vh / --sat / --sab 三个"真·视口尺寸"变量。
   为什么要在 CSS 前跑？因为 100dvh 在 iOS17 Beta + WebView 某些组合下仍会被地址栏高度带偏，
   而 visualViewport.height 才是"真实的、排除了工具栏/键盘的可见高度"。
   safe-area 也顺手通过 JS 拉一次，作为 CSS env() 的兜底（鸿蒙/部分安卓没有 env() 实现）。*/
(function(){try{
  var r=document.documentElement;
  var setV=function(){
    try{
      var w=window, vv=w.visualViewport;
      var vh = vv && vv.height ? vv.height : (w.innerHeight||r.clientHeight||screen.height||667);
      var vw = vv && vv.width  ? vv.width  : (w.innerWidth ||r.clientWidth ||screen.width ||375);
      r.style.setProperty('--vh',(vh*0.01).toFixed(3)+'px');
      r.style.setProperty('--dvh',(vh*0.01).toFixed(3)+'px');
      r.style.setProperty('--vw',(vw*0.01).toFixed(3)+'px');
      /* safe-area：优先 CSS env()，拿不到就用 getComputedStyle 反推 */
      try{
        var st=getComputedStyle(r);
        var sat=parseFloat(st.getPropertyValue('--sat')||'0')||0;
        var sab=parseFloat(st.getPropertyValue('--sab')||'0')||0;
        if(!sat||!sab){
          // 用一个临时元素去读 env()，因为 CSS 变量不会自己展开 env()
          var t=document.createElement('div');
          t.style.cssText='position:fixed;visibility:hidden;pointer-events:none;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);left:-9999px;top:-9999px;width:1px;height:1px';
          document.head.appendChild(t);
          var cs=getComputedStyle(t);
          r.style.setProperty('--sat',parseFloat(cs.paddingTop||'0')+'px');
          r.style.setProperty('--sab',parseFloat(cs.paddingBottom||'0')+'px');
          t.remove();
        }
      }catch(_){}
    }catch(_){}
  };
  setV();
  var evs=['resize','orientationchange','load','pageshow','scroll'];
  if(window.visualViewport){window.visualViewport.addEventListener('resize',setV);window.visualViewport.addEventListener('scroll',setV)}
  for(var i=0;i<evs.length;i++){window.addEventListener(evs[i],setV,{passive:true})}
  setTimeout(setV,80);setTimeout(setV,500);
}catch(_){}
})();
/* iOS 17 Beta pageshow 兜底：用户从 bfcache（前进/后退缓存）回来时，_boot 可能不会再跑，
   所以我们在 window 上埋一个全局标记，pageshow.persisted=true 时强制重跑。后续 _boot 里会读它。*/
window._MCU_FIXED_VH = true;
</script>
<style>
/* ===================== v1.4：主题设计系统（深色 / 浅色 / 跟随系统 / 自定义图）
   用 CSS 变量统一颜色，切主题只改 :root 的 class，所有元素联动。
   自定义背景图通过 body.style.setProperty('--bg-user:url(...)') 注入，不走 <img> 防泄露。
   四端字体优化：iOS/鸿蒙/安卓/Windows 各自调用系统里最漂亮的一款中文，
   英文用改良的无衬线，整体观感从"灰蓝科技风"升级成"电影感高级配色"。
========================================================================= */

/* ============================================================
   Beta v2.3 · 电影感主题令牌（深色·深夜蓝黑金 / 浅色·羊皮纸）
   —— 把颜色拆成：背景(4层) / 前景(4层) / 强调色(6色) / 描边(3层) / 玻璃材质(4种)
      所有组件统一调用令牌，做到换主题零硬编码色值。
   ============================================================ */
:root, :root[data-theme='dark']{
  /* ░░ 背景四层：从最暗底 → 最高亮卡片 ░░ */
  --bg-0:#050810;             /* 全局底色：纯深夜 */
  --bg-1:#0b111d;             /* 面板底 */
  --bg-2:#111928;             /* 卡片/输入底 */
  --bg-3:#172337;             /* 悬浮/按压底 */
  --bg-4:#1e2d46;             /* 极亮底色（chip选中）*/
  --bg-grad-a:
    radial-gradient(1200px 520px at 18% -40px, rgba(196,52,59,.30), transparent 58%),
    radial-gradient(900px 380px at 82% 0%, rgba(233,179,105,.18), transparent 58%),
    radial-gradient(circle at 50% 100%, rgba(99,102,241,.14), transparent 60%),
    linear-gradient(180deg,#060a12 0%, #03060b 100%);

  /* ░░ 前景四层：主色→极淡辅助 ░░ */
  --fg-0:#f4efe5;             /* 正文主色：暖米白 */
  --fg-1:#cfd7e3;             /* 次级文字 */
  --fg-2:#8795ac;             /* 辅助文字 */
  --fg-3:#5a6679;             /* 占位符/禁用 */

  /* ░░ 六色强调：漫威海报级调色板（暖金/橙红/草绿/幻紫/警蓝/警告红）░░ */
  --accent:#eab872;           /* 暖金：漫威 Logo 色（饱和度拉低6%更耐看）*/
  --accent-rgb:234,184,114;
  --accent-2:#ef7364;         /* 橙红：钢铁侠战甲主色 */
  --accent-2-rgb:239,115,100;
  --hero:#7ad391;             /* 草绿：美队制服浅草绿 */
  --hero-rgb:122,211,145;
  --magic:#a594ff;            /* 幻紫：奇异博士魔法色 */
  --magic-rgb:165,148,255;
  --info:#6cb2ff;             /* 信息蓝：神盾蓝 */
  --info-rgb:108,178,255;
  --danger:#ff7080;           /* 警告红 */
  --danger-rgb:255,112,128;

  /* ░░ 描边三层：细线/粗线/发光线 ░░ */
  --line:#1e2a3e;             /* 分割细线 */
  --line-2:#2a3954;           /* 卡片描边 */
  --line-3:#3d5178;           /* 选中/hover描边 */

  /* ░░ 玻璃材质：四种毛玻璃透明度（供弹窗/面板/卡片/悬浮按需选用）░░ */
  --glass-a:rgba(255,255,255,.03);   /* 最薄：chip/tag */
  --glass-b:rgba(255,255,255,.05);   /* 薄：选项卡 */
  --glass-c:rgba(255,255,255,.07);   /* 中：面板 */
  --glass-d:rgba(255,255,255,.10);   /* 厚：弹窗 */
  --glow-accent:0 0 24px rgba(var(--accent-rgb),.30);
  --glow-accent-s:0 0 12px rgba(var(--accent-rgb),.22);
  --glow-red:0 0 24px rgba(var(--accent-2-rgb),.28);

  /* ░░ 阴影五级（含内高光）：层次拉开，告别"土气"扁平 ░░ */
  --shadow-xs:0 1px 2px rgba(0,0,0,.40), 0 1px 0 rgba(255,255,255,.03) inset;
  --shadow-sm:0 4px 12px rgba(0,0,0,.45), 0 1px 0 rgba(255,255,255,.04) inset;
  --shadow-md:0 10px 28px rgba(0,0,0,.56), 0 1px 0 rgba(255,255,255,.05) inset;
  --shadow-lg:0 20px 56px rgba(0,0,0,.70), 0 1px 0 rgba(255,255,255,.05) inset;
  --shadow-inset:inset 0 1px 0 rgba(255,255,255,.06), inset 0 -1px 0 rgba(0,0,0,.3);

  --radius:10px;
  --radius-md:12px;
  --radius-lg:16px;
  --radius-xl:20px;
}

/* ---- 浅色主题（羊皮纸·复古漫画风 · 完整令牌镜像对齐）---- */
:root[data-theme='light']{
  --bg-0:#efe7d5;
  --bg-1:#f8f0dd;
  --bg-2:#fff9ef;
  --bg-3:#f1e6c9;
  --bg-4:#e8d9b2;
  --bg-grad-a:
    radial-gradient(1200px 520px at 18% -40px, rgba(196,96,40,.18), transparent 58%),
    radial-gradient(900px 380px at 82% 0%, rgba(170,97,29,.14), transparent 58%),
    linear-gradient(180deg,#f3ead6 0%, #e9dec3 100%);
  --fg-0:#1c1611;
  --fg-1:#3b3128;
  --fg-2:#6a5b4a;
  --fg-3:#9a8a74;
  --accent:#a7631a;           /* 深棕金：漫威金的浅色版 */
  --accent-rgb:167,99,26;
  --accent-2:#c24632;
  --accent-2-rgb:194,70,50;
  --hero:#2b7b4e;
  --hero-rgb:43,123,78;
  --magic:#5d43a2;
  --magic-rgb:93,67,162;
  --info:#1c6fb8;
  --info-rgb:28,111,184;
  --danger:#bf3846;
  --danger-rgb:191,56,70;
  --line:#d6c9aa;
  --line-2:#c3b38b;
  --line-3:#a5906a;
  --glass-a:rgba(0,0,0,.025);
  --glass-b:rgba(0,0,0,.035);
  --glass-c:rgba(0,0,0,.045);
  --glass-d:rgba(0,0,0,.055);
  --glow-accent:0 0 24px rgba(var(--accent-rgb),.22);
  --glow-accent-s:0 0 12px rgba(var(--accent-rgb),.15);
  --glow-red:0 0 24px rgba(var(--accent-2-rgb),.22);
  --shadow-xs:0 1px 2px rgba(60,42,18,.10), 0 1px 0 rgba(255,255,255,.65) inset;
  --shadow-sm:0 4px 12px rgba(60,42,18,.12), 0 1px 0 rgba(255,255,255,.70) inset;
  --shadow-md:0 10px 28px rgba(60,42,18,.16), 0 1px 0 rgba(255,255,255,.72) inset;
  --shadow-lg:0 20px 56px rgba(60,42,18,.22), 0 1px 0 rgba(255,255,255,.75) inset;
  --shadow-inset:inset 0 1px 0 rgba(255,255,255,.7), inset 0 -1px 0 rgba(0,0,0,.06);
  --radius:10px;
  --radius-md:12px;
  --radius-lg:16px;
  --radius-xl:20px;
}

/* ===================== 基础 · 四端通用 ===================== */
/* 硬件加速：所有高频动效元素先走 GPU，减少卡顿 */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;outline:none;
  -webkit-touch-callout:none; /* iOS 禁长按弹出菜单 */}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;-ms-text-size-adjust:100%;
     -webkit-tap-highlight-color:transparent;height:100%}
html{height:100%;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
html,body{
  /* iPhone15PM(iOS17)/鸿蒙/安卓 X5：touch-action 必须允许 pan-y；manipulation 在 X5/iOS16+ 已经隐含 pan-y，但显式写更稳 */
  touch-action:pan-y manipulation;
  /* overscroll-behavior：iOS Safari 17+ 设为 none 会误杀 touchmove 触发滚动链 → 改为 auto（仅 X5/安卓 设 contain） */
  overscroll-behavior:auto;
  -webkit-user-drag:none;
  user-select:none;          /* 抖音投放：禁长按选中文字，防误触 */
  -webkit-user-select:none
}
@supports not (-webkit-touch-callout:none) {
  html,body{overscroll-behavior-y:contain;overscroll-behavior-x:auto}
}
/* 仅输入框允许选中文字，避免复制 API Key 等场景不可用 */
input,textarea,[contenteditable="true"]{user-select:text;-webkit-user-select:text}
body{
  margin:0;
  /* 真·视口高度回退链：JS注入 --dvh 最准 */
  min-height:100vh;
  min-height:100svh;
  min-height:100dvh;
  min-height:calc(var(--dvh, 1vh) * 100);
  height:auto;
  overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  background:var(--bg-0);
  color:var(--fg-0);
  /* ================= Beta v2.2 · 电影海报级字体栈 =================
     中文：思源黑体 CN / 鸿蒙黑体 / 苹方 → 视觉统一
     英数：Inter → 现代无衬线等宽数字质感
     字号 15.2px + 行距 1.78 → 阅读密度更像电影海报字幕而非"土气"表格
     ===================================================================== */
  font:15.2px/1.78
    "Inter","SF Pro Display","SF Pro Text",
    -apple-system,system-ui,"Segoe UI Variable","Segoe UI",
    "PingFang SC","HarmonyOS Sans SC","HarmonyOS Sans","Noto Sans CJK SC",
    "Source Han Sans CN","Microsoft YaHei UI","Microsoft YaHei","Heiti SC",
    sans-serif;
  font-variant-numeric:tabular-nums;
  -webkit-font-feature-settings:"tnum" 1, "ss01" 1, "cv11" 1;
  font-feature-settings:"tnum" 1, "ss01" 1, "cv11" 1;
  letter-spacing:.1px;                    /* 极轻字距，高级感必备 */
  /* 背景层叠：自定义图(默认空) → 三段光晕渐变 → 线性底 */
  background-image: var(--bg-user, none), var(--bg-grad-a);
  background-size: cover, auto;
  background-position: center, auto;
  background-attachment: fixed, fixed;
  background-repeat: no-repeat, repeat;
  /* safe-area */
  padding-left:calc(12px + env(safe-area-inset-left, 0px));
  padding-right:calc(12px + env(safe-area-inset-right, 0px));
  padding-top:env(safe-area-inset-top, 0px);
  padding-bottom:env(safe-area-inset-bottom, 0px);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
  word-break:break-word;
  overflow-wrap:break-word;
  /* 主题切换颜色软过渡（0.32s 比之前稍慢，观感"高级切换"）*/
  transition:background-color .32s cubic-bezier(.4,0,.2,1),
             color .32s cubic-bezier(.4,0,.2,1);
}
/* ⚠️ v1.4 手机端"新手教程只露一半卡死"根因修复：
   绝对不能在 html/body 上写 transform / perspective / contain:layout-paint / will-change:transform
   —— 它们会让 position: fixed 的模态框/遮罩「相对 body 而非视口」定位（CSS 规范），
   短视口（手机）时模态框 top 会被推到 700px+，下半屏+下一步按钮直接跑出屏幕，用户以为"卡死"。
   硬件加速改在内容容器 .screen / .setup-card / .panel 上（L168/L177/L306 已经写过 translateZ(0)）。*/
body { transform: none !important; -webkit-transform: none !important; perspective: none !important; -webkit-perspective: none !important; contain: none !important; will-change: auto !important; }

img,svg{max-width:100%;vertical-align:middle;pointer-events:none;user-select:none;-webkit-user-drag:none}
/* 选择文本颜色（仅输入框内生效） */
::selection{background:color-mix(in srgb, var(--accent) 36%, transparent);color:var(--fg-0)}
::-moz-selection{background:color-mix(in srgb, var(--accent) 36%, transparent);color:var(--fg-0)}
/* 滚动条样式：跟随主题 */
*::-webkit-scrollbar{width:6px;height:6px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:color-mix(in srgb, var(--fg-0) 22%, transparent);border-radius:3px}
*::-webkit-scrollbar-thumb:hover{background:color-mix(in srgb, var(--fg-0) 35%, transparent)}
*{scrollbar-width:thin;scrollbar-color:color-mix(in srgb, var(--fg-0) 22%, transparent) transparent}
/* iOS 惯性滚动（仅滚动容器内） */
.scroll-y{-webkit-overflow-scrolling:touch;overflow-y:auto}
/* 禁止长按弹出系统菜单（图片/链接/抖音投放重要） */
a,img,button,.opt,.chip,.panel h3{-webkit-touch-callout:none;-webkit-user-drag:none}

/* ===================== 布局 · 四端通用 ===================== */
.screen{
  padding:max(12px, env(safe-area-inset-top,0px)) max(12px, env(safe-area-inset-right,12px)) max(12px, env(safe-area-inset-bottom,0px)) max(12px, env(safe-area-inset-left,0px));
  padding-top:max(14px, env(safe-area-inset-top,0px), var(--sat, 0px));
  padding-bottom:max(14px, env(safe-area-inset-bottom,0px), var(--sab, 0px));
  max-width:1680px;margin:0 auto;
  /* v1.5：去掉 contain:layout → contain:layout 会把合成层限制在自身边界
     并让 body 滚动链条「看不到」子元素溢出高度 → iPhone15PM 表现为「完全不能滑」。
     只保留 style + paint 两个轻量 contain 就够了。 */
  contain:style paint;
  /* v1.6：鸿蒙/安卓 X5 滚动链条再加固：显式 min-height 用 JS 计算的 --dvh，避免某些机型 100dvh 算成 0。 */
  min-height:calc(var(--dvh,1vh)*100);
  box-sizing:border-box;
  /* 避免滚动时背景撕裂 */
  transform:translateZ(0);-webkit-transform:translateZ(0)
}
.setup-card{
  max-width:900px;margin:14px auto;
  /* Beta v1.9：主界面电影感重做。深底渐变 + 暗角 vignette，两侧加英雄徽章光晕 */
  background:
    radial-gradient(1200px 420px at 50% -80px,rgba(193,39,45,.28),transparent 60%),
    radial-gradient(900px 300px at 50% 110%,rgba(47,127,224,.22),transparent 60%),
    linear-gradient(180deg,#0f1622 0%,#0a1018 60%,#080d14 100%);
  border:1px solid #2b3a4e;border-radius:16px;padding:22px 22px 20px;
  box-shadow:0 0 60px rgba(0,0,0,.8),inset 0 0 120px rgba(0,0,0,.45);
  -webkit-mask-image:-webkit-radial-gradient(white,black);
  transform:translateZ(0);position:relative
}
.setup-card::before{
  content:"";position:absolute;inset:0;border-radius:16px;pointer-events:none;
  background:radial-gradient(1000px 300px at 50% 0%,rgba(232,198,106,.08),transparent 60%);opacity:.8
}
/* iOS Safari 背景渐变 + 圆角组合时可能出现黑边，给容器加独立绘制层 */
/* Beta v1.9：标题区醒目化重做，超级英雄电影海报风 */
.big-title{font-size:clamp(22px,5.6vw,34px);
  color:transparent;letter-spacing:3px;text-align:center;font-weight:900;line-height:1.22;
  background:linear-gradient(180deg,#ffe08a 0%,#e8c66a 35%,#c1272d 62%,#7a1a1e 100%);
  -webkit-background-clip:text;background-clip:text;
  text-shadow:0 2px 18px rgba(232,198,106,.18),0 1px 0 rgba(0,0,0,.5);
  font-size:max(21px,min(5.6vw,34px));

.big-title::after{
  content:"";display:block;width:min(360px,60vw);height:2px;margin:12px auto 8px;
  background:linear-gradient(90deg,transparent,rgba(232,198,106,.85),rgba(193,39,45,.85),transparent)
}
.sub-title{text-align:center;color:#a9bad1;font-size:max(12.5px,min(2.2vw,15px));margin-top:4px;letter-spacing:1.5px;font-weight:500}
.beta-tag{display:inline-block;margin:0 auto 8px;padding:3px 10px;border-radius:999px;
  background:linear-gradient(90deg,rgba(232,198,106,.18),rgba(193,39,45,.22));
  color:#ffe9b3;border:1px solid rgba(232,198,106,.35);
  font-size:11.5px;font-weight:700;letter-spacing:2px;text-align:center}
.canon{margin:12px 0;padding:10px 12px;border:1px dashed #3a4757;border-radius:10px;color:#9fb0c4;font-size:12.5px;
  background:linear-gradient(180deg,rgba(13,20,29,.8),rgba(13,20,29,.5));
  -webkit-hyphens:auto;hyphens:auto}
.quote{text-align:center;color:#aab8ca;font-style:italic;font-size:13px;margin:8px 0 14px;padding:6px 10px;
  border-left:2px solid rgba(232,198,106,.5);border-right:2px solid rgba(232,198,106,.5);

/* ===================== Beta v1.9 · 开局主界面简易/专家模式切换（用户能直接在进游戏前切换）===================== */
.home-modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0 6px}
@media(max-width:640px){.home-modes{grid-template-columns:1fr}}
.home-mode{position:relative;padding:14px 14px 12px;border-radius:12px;border:2px solid var(--line-2);
  background:linear-gradient(180deg,color-mix(in srgb,var(--bg-2) 80%,transparent),rgba(0,0,0,.3));
  cursor:pointer;user-select:none;transition:all .18s ease;color:var(--fg-0);text-align:left}
.home-mode:hover{transform:translateY(-1px);border-color:var(--line-1);box-shadow:0 6px 20px rgba(0,0,0,.35)}
.home-mode[aria-checked="true"]{
  border-color:transparent;outline:2px solid rgba(232,198,106,.95);outline-offset:-2px;
  box-shadow:0 0 0 1px rgba(193,39,45,.4) inset,0 8px 26px rgba(232,198,106,.14);
  background:linear-gradient(180deg,color-mix(in srgb,rgba(232,198,106,.18) 55%,var(--bg-2)),rgba(193,39,45,.08))
}
.home-mode .hm-hd{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.home-mode .hm-ic{font-size:22px;flex:0 0 auto;filter:drop-shadow(0 1px 3px rgba(0,0,0,.4))}
.home-mode .hm-name{font-weight:900;font-size:16px;letter-spacing:1.5px}
.home-mode .hm-for{margin-left:auto;font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line-2);color:var(--fg-2)}
.home-mode[aria-checked="true"] .hm-for{background:linear-gradient(90deg,rgba(232,198,106,.25),rgba(193,39,45,.25));color:#ffe9b3;border-color:rgba(232,198,106,.5)}
.home-mode .hm-desc{font-size:12.5px;line-height:1.7;color:var(--fg-1);margin-top:4px}
.home-mode .hm-check{position:absolute;top:10px;right:12px;font-weight:900;font-size:14px;color:var(--accent);display:none;letter-spacing:1px}
.home-mode[aria-checked="true"] .hm-check{display:block}
/* 创角表单栅格：移动端 1 列，平板/桌面多列 */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;
  /* 栅格渲染隔离 */
  contain:layout style}
.fgrid label{display:block;font-size:12px;color:#8fa0b5;margin-bottom:4px}
.ffield{margin-bottom:12px}

/* ===================== 输入控件 · iOS/鸿蒙/X5 兼容 =====================
   关键：iOS Safari 聚焦时，字号 <16px 会强制放大整页 → 所有输入统一 16px
   补充：加 translateZ(0) 防 iOS 输入框聚焦时背景闪烁；加 -webkit-appearance 防 X5 自定义样式丢失 */
input,select,textarea{
  width:100%;background:#0b1219;color:var(--fg-0);border:1px solid #2a3644;border-radius:6px;
  padding:10px;font:inherit;font-size:16px;line-height:1.5;
  touch-action:manipulation;
  -webkit-appearance:none;-moz-appearance:none;appearance:none;
  -webkit-transform:translateZ(0);transform:translateZ(0);
  /* 鸿蒙 X5：输入框聚焦放大/蓝边兜底 */
  outline:none;-webkit-tap-highlight-color:transparent;
  /* 避免 iOS 输入框圆角叠加不生效 */
  isolation:isolate
}
select{-webkit-appearance:none;appearance:none;
 background-image:linear-gradient(45deg,transparent 50%,var(--fg-2) 50%),linear-gradient(135deg,var(--fg-2) 50%,transparent 50%);
 background-position:calc(100% - 16px) calc(50% + 2px),calc(100% - 11px) calc(50% + 2px);
 background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:32px;
 /* X5 不显示箭头图标兜底：额外加右侧 padding */
 min-height:42px}
textarea{min-height:76px;resize:vertical;font-family:Consolas,"Courier New",monospace;font-size:16px;
  /* iOS 弹起键盘时 textarea 可能超出可视区；允许垂直滚 */
  overflow-y:auto;-webkit-overflow-scrolling:touch}
input:focus,select:focus,textarea:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 2px rgba(232,198,106,.18);
  /* 鸿蒙：自带聚焦蓝圈，显式覆盖 */
  outline:none
}
/* date/time 类型在 iOS/鸿蒙上额外 padding，防控件挤压 */
input[type="date"],input[type="time"],input[type="datetime-local"]{
  min-height:42px;line-height:1.4
}

/* ===================== 按钮 · 四端触摸 + 点击 = 无延迟 =====================
   HIG 标准：触摸目标 ≥ 44×44px（iOS/鸿蒙）；安卓 48dp；桌面 ≥ 32px
   这里统一 min-height 44px，兼顾四端。
   :active 反馈 + 硬件加速，避免点击 200ms 无反馈的"卡顿"感觉 */
button{
  background:#16202c;color:#cfe0f2;border:1px solid #2c3a4b;border-radius:6px;padding:9px 13px;
  cursor:pointer;font-size:13.5px;font-family:inherit;min-height:44px;
  /* 用 transform 过渡，走 GPU，iOS/鸿蒙不掉帧 */
  transition:transform .08s ease, border-color .15s, box-shadow .15s, background-color .15s;
  -webkit-transition:-webkit-transform .08s ease, border-color .15s, box-shadow .15s, background-color .15s;
  touch-action:manipulation;
  position:relative;
  -webkit-transform:translateZ(0);transform:translateZ(0);
  backface-visibility:hidden;
  /* 防按钮文字换行后高度塌陷；允许换行 */
  white-space:pre-wrap;word-break:break-word;
  text-align:center;display:inline-flex;align-items:center;justify-content:center;gap:4px;
  /* Windows 高对比度模式兜底 */
  forced-color-adjust:auto;
  /* 加一个可点击的"隐形外扩热区"：用伪元素向外扩 4px，小屏不点不到 */
  isolation:isolate
}
/* ===================== 按钮通用（去"土气"：统一玻璃底 + 软阴影 + 按压回弹）===================== */
button{
  background:var(--bg-2);
  background-image:linear-gradient(180deg, var(--glass-b), transparent 55%);
  border:1px solid var(--line-2);
  color:var(--fg-0);
  border-radius:var(--radius);
  padding:9px 14px;
  font:inherit;font-size:14px;font-weight:600;letter-spacing:.2px;
  min-height:44px;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  cursor:pointer;
  touch-action:manipulation;
  -webkit-appearance:none;appearance:none;
  box-shadow:var(--shadow-xs), var(--shadow-inset);
  transition:
    transform .10s cubic-bezier(.2,.8,.2,1),
    border-color .18s ease,
    background-color .18s ease,
    box-shadow .18s ease,
    filter .18s ease;
  -webkit-transform:translateZ(0);transform:translateZ(0);
  position:relative;overflow:hidden;
}
/* 扫光层：hover 时从左至右掠过一道微光（高级感来源之一）*/
button::before{
  content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,.12), transparent);
  transform:skewX(-18deg);
  transition:left .55s ease;
  pointer-events:none;
}
button:active{
  -webkit-transform:scale3d(.975,.975,1) translateZ(0);
  transform:scale3d(.975,.975,1) translateZ(0);
}
/* ===================== 主按钮：金 + 橙红渐变（漫威海报色）+ 呼吸光动效 ===================== */
button.primary{
  background:
    linear-gradient(180deg, rgba(255,255,255,.14) 0%, rgba(255,255,255,0) 45%, rgba(0,0,0,.18) 100%),
    linear-gradient(135deg, #f2c77a 0%, #e7a14a 35%, #ef6d55 72%, #d94c4c 100%);
  border:1px solid rgba(255,255,255,.18);
  color:#fffdf5;
  text-shadow:0 1px 2px rgba(0,0,0,.28);
  box-shadow:
    0 2px 10px rgba(196,58,45,.26),
    0 0 0 1px rgba(234,184,114,.22) inset,
    0 1px 0 rgba(255,255,255,.28) inset;
  /* 呼吸光：3.8s 一周期，强度克制不晃眼 */
  animation:btnBreath 3.8s ease-in-out infinite;
  position:relative;
}
button.primary::after{
  /* 顶部细高光：模拟金属弧面反光 */
  content:"";position:absolute;left:8%;right:8%;top:1px;height:1px;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent);
  border-radius:999px;pointer-events:none;
}
@keyframes btnBreath{
  0%,100%{ box-shadow:0 2px 10px rgba(196,58,45,.26), 0 0 0 1px rgba(234,184,114,.22) inset, 0 1px 0 rgba(255,255,255,.28) inset; }
  50%    { box-shadow:0 4px 22px rgba(196,58,45,.42), 0 0 24px rgba(234,184,114,.30), 0 0 0 1px rgba(234,184,114,.30) inset, 0 1px 0 rgba(255,255,255,.32) inset; }
}
button.primary:active{
  -webkit-transform:scale3d(.97,.97,1) translateZ(0);
  transform:scale3d(.97,.97,1) translateZ(0);
  filter:saturate(1.05) brightness(.96);
}
/* 鼠标设备 hover 统一（移动端禁用防粘滞）*/
@media(hover:hover) and (pointer:fine){
  button:hover{
    border-color:var(--line-3);
    transform:translateY(-1px) translateZ(0);
    -webkit-transform:translateY(-1px) translateZ(0);
    box-shadow:var(--shadow-sm), var(--shadow-inset);
  }
  button:hover::before{ left:120%; }  /* 扫光掠过 */
  button.primary:hover{
    box-shadow:
      0 6px 28px rgba(196,58,45,.48),
      0 0 32px rgba(234,184,114,.38),
      0 0 0 1px rgba(234,184,114,.30) inset,
      0 1px 0 rgba(255,255,255,.32) inset;
  }
}
/* 键盘 focus 环（无障碍）*/
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.opt:focus-visible,.chip:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px;
  border-radius:var(--radius);
}

/* ===================== 顶栏（玻璃毛质感 + 柔光内边框）===================== */
.topbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;
  background:
    linear-gradient(180deg, var(--glass-c), transparent 70%),
    linear-gradient(90deg, rgba(var(--accent-rgb),.06), rgba(var(--accent-2-rgb),.04));
  border:1px solid var(--line-2);
  border-radius:var(--radius-md);
  padding:10px 13px;margin-bottom:12px;
  box-shadow:var(--shadow-xs), var(--shadow-inset);
  backdrop-filter: blur(10px) saturate(1.2);
  -webkit-backdrop-filter: blur(10px) saturate(1.2);
  -webkit-transform:translateZ(0);transform:translateZ(0);
}
#engstat{font-size:12px;color:#7f8da0;flex:1;min-width:160px;word-break:break-all}
.topbtns{display:flex;flex-wrap:wrap;gap:6px}

/* ===================== 时间大卡片（电影信息卡风格）===================== */
.timecard{
  background:
    linear-gradient(180deg, rgba(var(--accent-rgb),.08) 0%, transparent 50%),
    linear-gradient(180deg, var(--bg-2), var(--bg-1));
  border:1px solid var(--line-2);
  border-radius:var(--radius-lg);
  padding:16px 16px 14px;text-align:center;margin-bottom:14px;
  box-shadow:var(--shadow-md), var(--shadow-inset);
  position:relative;overflow:hidden;
  -webkit-transform:translateZ(0);transform:translateZ(0);
  contain:layout style paint
}
/* 顶部暖金细光晕条（电影海报级氛围感）*/
.timecard::before{
  content:"";position:absolute;left:10%;right:10%;top:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);
  opacity:.7;pointer-events:none
}
.timecard .lab{color:#7f8da0;font-size:11.5px;letter-spacing:2px;margin-bottom:4px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;row-gap:6px;column-gap:2px}
#heroBadge{display:inline-block;max-width:72vw;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;-webkit-line-clamp:1}
@media (max-width:420px){
  .timecard .lab{letter-spacing:1px}
  #heroBadge{font-size:11px;padding:2px 8px;max-width:74vw}
}
.timecard .big{font-family:Consolas,monospace;font-size:clamp(17px,4.8vw,23px);color:var(--accent);letter-spacing:1px;line-height:1.35;word-break:break-all;
  font-size:max(16px,min(4.8vw,23px))}
.timecard .sub{color:var(--fg-2);font-size:12.5px;margin-top:5px}
.timecard .turn{display:inline-block;margin-top:6px;font-size:11.5px;color:#6f8298;border:1px solid var(--line-2);border-radius:10px;padding:2px 10px}
.banner{background:#1c1013;border:1px solid #6e2229;color:#ffb3ba;padding:9px 12px;border-radius:8px;margin-bottom:10px;font-size:13px;
  /* 横幅加动画：3d translate 走 GPU，不卡 */
  animation:fadeIn3d .25s ease-out}

/* ===================== 面板（玻璃拟态 · 含内高光）===================== */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start;
  contain:layout style paint}
.panel{
  background:
    linear-gradient(180deg, var(--glass-c), transparent 60%),
    var(--bg-1);
  border:1px solid var(--line-2);
  border-radius:var(--radius-md);
  margin-bottom:12px;overflow:hidden;
  box-shadow:var(--shadow-sm), var(--shadow-inset);
  -webkit-transform:translateZ(0);transform:translateZ(0);
  contain:layout style;
  -webkit-mask-image:-webkit-radial-gradient(white,black)
}
.panel h3{margin:0;padding:11px 13px;
  background:
    linear-gradient(90deg, rgba(var(--accent-rgb),.08), transparent 70%),
    linear-gradient(180deg, var(--bg-2), var(--bg-1));
  font-size:13.8px;color:var(--accent);font-weight:700;
  border-bottom:1px solid var(--line);
  letter-spacing:.4px;cursor:pointer;user-select:none;
  display:flex;align-items:center;gap:8px;min-height:46px;flex-wrap:wrap;
  position:relative}
.panel h3::after{content:"";position:absolute;top:-4px;left:0;right:0;bottom:-4px}
.panel h3:active{background:#232f3e}
.tri{color:var(--accent);font-size:10px;width:11px;flex:0 0 11px;text-align:center;
  /* 旋转动画走 3d，避免折叠时抖动 */
  transition:transform .18s ease;transform:translateZ(0);
  display:inline-block;line-height:1}
.panel.collapsed .tri{-webkit-transform:rotate(-90deg) translateZ(0);transform:rotate(-90deg) translateZ(0)}
.ptime{margin-left:auto;color:#8496ab;font-size:11.5px;font-family:Consolas,monospace;font-weight:400;letter-spacing:0;text-align:right}
.panel .body{padding:10px 12px;max-height:400px;max-height:min(400px,58vh);overflow:auto;-webkit-overflow-scrolling:touch;
  /* v1.9：去掉 contain:layout（会切断 body 滚动链）与 overscroll-behavior:contain
     （电脑端鼠标滚轮在 story 面板里滚到底就卡住、不传到页面）→ 改 auto 让滚轮顺利续滚整页 */
  contain:style paint;
  overscroll-behavior:auto
}
.kv{display:flex;gap:8px;padding:3px 0;border-bottom:1px dashed #1b2430;font-size:13px;
  /* kv 是高重复元素，减少每个条目都产生新合成层 */
  contain:layout style}
.kv .k{color:#7f8da0;flex:0 0 78px;font-size:12px}
.kv .v{color:var(--fg-0);flex:1;word-break:break-word;overflow-wrap:anywhere}
.subh2{color:var(--fg-2);font-size:12px;margin:8px 0 3px;border-left:2px solid #2f3d4e;padding-left:6px}
.card{border:1px solid #22303f;border-radius:7px;padding:7px 9px;margin-bottom:7px;background:#101822;font-size:12.5px;
  -webkit-transform:translateZ(0);transform:translateZ(0)}
.card b{color:var(--accent)}
ul{margin:4px 0;padding-left:18px}
li{margin:3px 0;font-size:13px}
.dim{color:#5f6d7e;font-size:12.5px}
/* 世界日志滚动容器：长列表优化 */
#story{
  max-height:560px;max-height:min(560px,62vh);overflow-y:auto;padding:12px;
  background:#0a1017;border-radius:8px;border:1px solid #1c2634;
  -webkit-overflow-scrolling:touch;
  /* contain + 滚动锚定，防 100+ 条日志时滚到底部卡顿 */
  contain:layout style paint;
  overflow-anchor:none;
  overscroll-behavior:contain;
  -webkit-mask-image:-webkit-radial-gradient(white,black)
}
.entry{
  border-left:2px solid var(--line-2);padding:6px 0 10px 12px;margin-bottom:12px;
  contain:layout style;
  -webkit-transform:translateZ(0);transform:translateZ(0)
}
.entry .t{color:#6f7f92;font-size:11.5px;margin-bottom:4px;font-family:Consolas,monospace}
.entry.self{border-left-color:#c1272d;background:#170f12;border-radius:0 6px 6px 0;padding-right:8px}
.entry .b{color:#d5dfec}
.entry blockquote{margin:6px 0;padding:4px 10px;border-left:2px solid #4a5b70;color:#a8b8cc;background:#0f1620}
.entry code{background:#1a2431;padding:1px 5px;border-radius:4px;color:var(--accent);word-break:break-all}
.entry hr{border:none;border-top:1px solid #243040;margin:10px 0}
.hints{margin-top:8px;padding:7px 9px;border:1px dashed #33465c;border-radius:6px;background:#0d1520;font-size:12px;color:var(--fg-2)}
.foot{text-align:center;color:#55636f;font-size:11.5px;padding:14px 14px calc(14px + env(safe-area-inset-bottom))}

/* ===================== 选项卡 opt · 玻璃卡片式（选中金色描边+脉动发光）===================== */
.opthead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap;gap:4px}
.opthead .lbl{color:var(--accent);font-size:12.8px;letter-spacing:.5px;font-weight:700}
.opthead .tip{color:var(--fg-2);font-size:11.5px}
.opt{
  display:flex;gap:11px;align-items:flex-start;padding:14px 13px;
  border:1.5px solid var(--line-2);
  border-radius:var(--radius-md);
  background:
    linear-gradient(180deg, var(--glass-b), transparent 60%),
    var(--bg-2);
  cursor:pointer;margin-bottom:9px;
  transition:
    transform .10s cubic-bezier(.2,.8,.2,1),
    border-color .20s ease,
    background-color .20s ease,
    box-shadow .20s ease;
  -webkit-transition:
    -webkit-transform .10s cubic-bezier(.2,.8,.2,1),
    border-color .20s ease,
    background-color .20s ease,
    box-shadow .20s ease;
  touch-action:manipulation;
  -webkit-transform:translateZ(0);transform:translateZ(0);
  min-height:48px;
  position:relative;
  box-shadow:var(--shadow-xs);
}
.opt::after{content:"";position:absolute;top:-3px;left:-3px;right:-3px;bottom:-3px}
.opt:active{
  -webkit-transform:scale3d(.985,.985,1) translateZ(0);
  transform:scale3d(.985,.985,1) translateZ(0);
  border-color:var(--accent);
  background:var(--bg-3);
  box-shadow:var(--glow-accent-s), var(--shadow-xs);
}
/* 桌面 hover：上浮 + 外发光扫光效果（克制不晃眼）*/
@media(hover:hover) and (pointer:fine){
  .opt:hover{
    transform:translateY(-2px) translateZ(0);
    -webkit-transform:translateY(-2px) translateZ(0);
    border-color:var(--line-3);
    box-shadow:var(--shadow-sm), 0 0 16px rgba(var(--accent-rgb),.14);
  }
}
.opt .tag{flex:0 0 24px;height:24px;line-height:22px;text-align:center;border-radius:50%;
  border:1.5px solid var(--accent);color:var(--accent);
  font-size:12px;font-weight:800;
  background:rgba(var(--accent-rgb),.08);
  box-shadow:0 1px 0 rgba(255,255,255,.05) inset;
}
.opt .txt{flex:1;color:var(--fg-1);font-size:14px;line-height:1.62;font-weight:500}
.actrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
#playerInput{min-height:74px}

/* ===================== chip · 圆角胶囊（选中金底描边+微发光）===================== */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:7px 0 3px}
.chip{
  font-size:12.5px;font-weight:500;
  padding:8px 13px;min-height:40px;
  border-radius:999px;
  border:1.5px solid var(--line-2);
  background:
    linear-gradient(180deg, var(--glass-a), transparent 65%),
    var(--bg-2);
  color:var(--fg-1);
  cursor:pointer;
  display:inline-flex;align-items:center;margin-bottom:3px;
  position:relative;touch-action:manipulation;
  transition:
    transform .10s cubic-bezier(.2,.8,.2,1),
    border-color .18s ease,
    background-color .18s ease,
    box-shadow .18s ease,
    color .18s ease;
  -webkit-transform:translateZ(0);transform:translateZ(0);
  box-shadow:var(--shadow-xs);
}
.chip::after{content:"";position:absolute;top:-3px;left:-3px;right:-3px;bottom:-3px}
.chip:active{
  -webkit-transform:scale3d(.965,.965,1) translateZ(0);
  transform:scale3d(.965,.965,1) translateZ(0);
}
.chip[aria-checked="true"], .chip.selected{
  /* 选中：暖色渐变背景 + 金色描边 + 脉动发光 —— 完全符合用户之前提过的交互反馈 */
  background:
    linear-gradient(180deg, rgba(255,255,255,.10), transparent 55%),
    linear-gradient(135deg, rgba(var(--accent-rgb),.22), rgba(var(--accent-2-rgb),.16));
  border-color:var(--accent);
  color:var(--fg-0);
  box-shadow:
    0 0 0 1px rgba(var(--accent-rgb),.28) inset,
    0 4px 16px rgba(var(--accent-rgb),.18),
    var(--glow-accent-s);
  animation:chipPulse 2.6s ease-in-out infinite;
}
@keyframes chipPulse{
  0%,100%{ box-shadow:0 0 0 1px rgba(var(--accent-rgb),.28) inset, 0 4px 16px rgba(var(--accent-rgb),.18), var(--glow-accent-s);}
  50%    { box-shadow:0 0 0 1px rgba(var(--accent-rgb),.38) inset, 0 5px 22px rgba(var(--accent-rgb),.28), 0 0 22px rgba(var(--accent-rgb),.28);}
}
.chip.free{
  border-color:color-mix(in srgb, var(--hero) 38%, var(--line-2));
  background:
    linear-gradient(180deg, rgba(var(--hero-rgb),.10), transparent 60%),
    var(--bg-2);
  color:var(--hero);
}

/* ===================== 自定义输入框 ===================== */
.cust{margin-top:8px;padding:11px 12px;border:1px solid #2f6fb0;border-radius:8px;background:#0d1925;display:none;
  animation:fadeIn3d .2s ease-out}
.cust.show{display:block}
.cust input{width:100%;box-sizing:border-box;background:#08101a;color:#e8f1fb;border:1px solid #31557c;border-radius:6px;padding:11px;font-size:16px;min-height:44px}
.cust input:focus{border-color:#5b9bd5;box-shadow:0 0 0 2px rgba(91,155,213,.25)}
.cust-err{color:#ff8b8b;margin-top:5px;min-height:15px;font-size:12px}
/* 3D 版淡入：走 GPU，不抖 */
@keyframes fadeIn3d{
  from{opacity:0;-webkit-transform:translate3d(0,-4px,0);transform:translate3d(0,-4px,0)}
  to{opacity:1;-webkit-transform:translate3d(0,0,0);transform:translate3d(0,0,0)}
}
@keyframes fadeIn{from{opacity:0;-webkit-transform:translate3d(0,-4px,0);transform:translate3d(0,-4px,0)}to{opacity:1;-webkit-transform:translate3d(0,0,0);transform:translate3d(0,0,0)}}

/* ---- v1.4：时间快进卡片按钮 ---- */
button.skip-card{
  flex-direction:column;align-items:stretch;text-align:left;justify-content:flex-start;
  padding:12px 12px;gap:2px;min-height:86px;
  background:var(--bg-2);border-color:var(--line-2);line-height:1.45}
button.skip-card b{color:var(--accent);font-size:15px;font-weight:700}
button.skip-card > div{font-size:12px;color:var(--fg-1);margin-top:2px}
button.skip-card > div.sd{font-size:11.5px;color:var(--fg-2);margin-top:4px}
button.skip-card:active{border-color:var(--accent);background:var(--bg-3)}

/* ===================== 模态框 · safe-area + 3D 过渡 ===================== */
.modal{
  display:none;
  /* v1.6 四端最新版兼容：top/bottom/left/right 四个 0 + fixed 定位 + 显式 height（calc(var(--dvh)*100) 来自 JS，基于 visualViewport）
     鸿蒙 4+ / 安卓 14 X5 有个老 bug：position:fixed; inset:0 但不写 height 时，会让内部 flex 的 max-height 按 document.body 高度算而不是视口，
     表现为"box 特别高，下一半在画面外"。加 height 之后就正确了。*/
  position:fixed; left:0; top:0; right:0; bottom:0;
  width:100%;
  height:100vh;
  height:100svh;
  height:100dvh;
  height:calc(var(--dvh, 1vh) * 100);
  background:rgba(0,0,0,.84);
  background-image:linear-gradient(180deg,rgba(0,0,0,.88),rgba(0,0,0,.82));
  z-index:99999;
  display:none;align-items:center;justify-content:center;
  padding: max(14px, env(safe-area-inset-top), var(--sat,0px)) max(14px, env(safe-area-inset-right), var(--sar,0px)) max(14px, env(safe-area-inset-bottom), var(--sab,0px)) max(14px, env(safe-area-inset-left), var(--sal,0px));
  overflow:visible;
  overscroll-behavior:contain;
  box-sizing:border-box;
}
.modal .box{
  background:#0f1620;border:1px solid #2f3d4e;border-radius:12px;padding:18px;
  width:100%;max-width:640px;
  /* v1.6：max-height 改为基于 JS 的 --dvh 最后一道；100dvh 在 iOS 17 Beta 有时会算错 */
  max-height: calc(100vh - 48px);
  max-height: calc(100svh - 48px);
  max-height: calc(100dvh - 48px);
  max-height: min(900px, calc(var(--dvh, 1vh) * 100 - 48px));
  overflow-y:auto;  -webkit-overflow-scrolling:touch;
  margin:0;
  -webkit-transform:translateZ(0);transform:translateZ(0);
  -webkit-mask-image:-webkit-radial-gradient(white,black);
  box-shadow:0 24px 80px rgba(0,0,0,.72);
  box-sizing:border-box;
}
.modal h3{margin:0 0 4px;color:var(--accent);font-size:16px;line-height:1.4}
.modal .warnline{background:#231217;border:1px solid #5e2029;color:#ffb3ba;padding:8px 10px;border-radius:6px;font-size:12px;margin:10px 0;line-height:1.65}
.modal .noteline{background:#101c26;border:1px solid #2c4a5e;color:#a8c4d8;padding:8px 10px;border-radius:6px;font-size:12px;margin:10px 0;line-height:1.75}
.modal .tutbox{background:#121a24;border:1px solid #2c4a5e;border-left:3px solid var(--accent);border-radius:6px;
 padding:10px 12px;font-size:12.2px;line-height:1.85;margin:8px 0;color:#a8c4d8;display:none}
.modal .tutbox.show{display:block}
.modal .tutbox b{color:var(--accent)}
.modal .tutbox code{background:#0b1219;padding:1px 5px;border-radius:3px;color:var(--hero);font-size:11.5px;word-break:break-all}
.modal .tutbox .tutk{color:var(--hero);font-weight:600}
.modal .noteline code{background:#0b1219;padding:1px 5px;border-radius:3px;color:var(--hero);font-size:11.5px;word-break:break-all}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0 2px}
.chip{
  font-size:12px;padding:8px 11px;min-height:40px;border-radius:16px;border:1px solid #33465c;
  background:#111a24;color:#9fb4c9;cursor:pointer;display:inline-flex;align-items:center;margin-bottom:2px;
  position:relative;touch-action:manipulation;
  transition:transform .08s ease;
  -webkit-transform:translateZ(0);transform:translateZ(0)
}
.chip::after{content:"";position:absolute;top:-3px;left:-3px;right:-3px;bottom:-3px}
.chip:active{-webkit-transform:scale3d(.96,.96,1);transform:scale3d(.96,.96,1)}
.chip.free{border-color:color-mix(in srgb, var(--hero) 35%, var(--line-2));background:#0f1f18;color:var(--hero)}

/* ===================== 加载遮罩（v1.4：双环旋转 + 进度条 + 双语金句慢切换）===================== */
#busy{
  display:none;position:fixed;top:0;left:0;right:0;bottom:0;
  background:rgba(4,7,11,.88);
  background-image:radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--accent) 12%, transparent) 0%, rgba(4,7,11,.94) 60%),
                  linear-gradient(180deg,rgba(4,7,11,.94),rgba(4,7,11,.9));
  z-index:120;
  align-items:center;justify-content:center;flex-direction:column;color:var(--accent);font-size:16px;text-align:center;
  padding:20px;
  padding-left:calc(20px + env(safe-area-inset-left,0px));
  padding-right:calc(20px + env(safe-area-inset-right,0px));
  padding-top:calc(20px + env(safe-area-inset-top,0px));
  padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));
  -webkit-transform:translateZ(0);transform:translateZ(0);
  backdrop-filter: blur(8px) saturate(1.4);
  -webkit-backdrop-filter: blur(8px) saturate(1.4);
  touch-action:none
}
#busyTxt{max-width:620px;color:var(--fg-1);font-weight:500;margin-bottom:18px;line-height:1.65;font-size:15px}
/* v1.4：双环旋转（外金内紫）+ 额外"粒子轨道"让转圈更有"电影片头"感
   兼容写法：用 border-top/border-right 的经典 spinner，X5/抖音 WebView 全都稳跑 */
.spin-wrap{position:relative;width:96px;height:96px;margin-bottom:18px;flex:0 0 auto;will-change:transform}
.spin{position:absolute;inset:0;width:96px;height:96px;border-radius:50%;
  box-sizing:border-box;border:3px solid var(--line-2);
  border-top:3px solid var(--accent);
  border-right:3px solid color-mix(in srgb, var(--accent) 65%, var(--line-2));
  border-bottom:3px solid color-mix(in srgb, var(--accent) 20%, var(--line-2));
  animation:sp3d .9s cubic-bezier(.55,.1,.45,.9) infinite;
  will-change:transform;-webkit-transform:translateZ(0);transform:translateZ(0);
  box-shadow:0 0 18px color-mix(in srgb, var(--accent) 28%, transparent) inset}
.spin2{position:absolute;left:12px;top:12px;width:72px;height:72px;border-radius:50%;box-sizing:border-box;
  border:3px solid color-mix(in srgb, var(--magic) 28%, transparent);
  border-top:3px solid var(--magic);
  border-left:3px solid color-mix(in srgb, var(--magic) 55%, transparent);
  animation:sp3d 1.6s linear infinite reverse;
  will-change:transform;-webkit-transform:translateZ(0);transform:translateZ(0)}
.spin3{position:absolute;left:26px;top:26px;width:44px;height:44px;border-radius:50%;box-sizing:border-box;
  border:2px dashed color-mix(in srgb, var(--hero) 55%, transparent);
  animation:sp3d 2.2s linear infinite;
  will-change:transform;-webkit-transform:translateZ(0);transform:translateZ(0)}
/* 进度条：10s 走到 92%，收到响应补到 100% */
.busy-prog{width:260px;max-width:78vw;height:6px;margin:4px 0 16px;border-radius:999px;
  background:color-mix(in srgb, var(--fg-0) 10%, transparent);
  box-shadow:0 0 0 1px color-mix(in srgb, var(--fg-0) 8%, transparent) inset;
  overflow:hidden;position:relative}
.busy-prog i{display:block;height:100%;width:0%;
  background:linear-gradient(90deg,color-mix(in srgb, var(--accent) 92%, transparent),var(--accent),color-mix(in srgb, var(--magic) 70%, var(--accent)));
  box-shadow:0 0 12px color-mix(in srgb, var(--accent) 50%, transparent);
  transition:width .35s ease;will-change:width}
/* 双语标语条：英文原句 + 中文翻译 + 作者英文原名·中文译名，一整次加载最多换 2~3 条 */
#busyQuote{
  max-width:720px;margin-top:6px;padding:18px 24px 16px;border-radius:14px;
  background:color-mix(in srgb, var(--bg-2) 86%, transparent);
  border:1px solid color-mix(in srgb, var(--accent) 28%, transparent);
  box-shadow:0 8px 28px rgba(0,0,0,.45), 0 0 0 1px color-mix(in srgb, var(--accent) 18%, transparent) inset;
  text-align:left
}
#busyQuote .q-en{
  font-size:16px;line-height:1.8;color:var(--fg-0);font-weight:600;letter-spacing:.2px;
  quotes:"\201C""\201D""\2018""\2019";font-family:"Georgia","Times New Roman","PingFang SC","HarmonyOS Sans SC",serif;
}
#busyQuote .q-en::before{content:open-quote;color:var(--accent);opacity:.85;margin-right:3px}
#busyQuote .q-en::after{content:close-quote;color:var(--accent);opacity:.85;margin-left:3px}
#busyQuote .q-zh{margin-top:6px;font-size:14px;line-height:1.85;color:var(--fg-1)}
#busyQuote .a{margin-top:9px;font-size:12.5px;color:var(--accent);text-align:right;font-weight:600;letter-spacing:.3px}
#busyQuote .a .en{opacity:.9;margin-right:6px}
#busyQuote .a .zh{color:color-mix(in srgb, var(--accent) 75%, var(--fg-2));font-weight:500}
#busyQuote .a::before{content:"—— ";opacity:.8}
@keyframes sp3d{to{-webkit-transform:rotateZ(360deg) translateZ(0);transform:rotateZ(360deg) translateZ(0)}}
#ioBox{margin-top:10px;padding:10px;border:1px solid var(--line-2);border-radius:8px;background:var(--bg-1)}

/* ===================== 主题卡片 · v1.4 ===================== */
.theme-card{
  position:relative;border:1px solid var(--line-2);background:var(--bg-1);
  border-radius:14px;padding:14px 14px 14px 60px;cursor:pointer;min-height:82px;
  transition:transform .18s ease, border-color .18s ease, background .18s ease, box-shadow .18s ease;
  -webkit-tap-highlight-color:transparent;
  box-shadow:0 1px 0 rgba(255,255,255,.02) inset;
}
.theme-card:hover{
  border-color:color-mix(in srgb, var(--accent) 55%, var(--line-2));
  -webkit-transform:translateY(-2px);transform:translateY(-2px);
  box-shadow:0 10px 22px rgba(0,0,0,.25), 0 0 0 1px color-mix(in srgb, var(--accent) 25%, transparent) inset;
}
.theme-card:active{-webkit-transform:scale(.985);transform:scale(.985)}
.theme-card.on{
  border-color:var(--accent);
  background:linear-gradient(135deg, color-mix(in srgb, var(--accent) 12%, var(--bg-1)) 0%, var(--bg-1) 100%);
  box-shadow:0 10px 24px color-mix(in srgb, var(--accent) 22%, transparent), 0 0 0 1px color-mix(in srgb, var(--accent) 45%, transparent) inset;
}
.theme-icon{
  position:absolute;left:14px;top:14px;width:36px;height:36px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;font-size:22px;
  background:linear-gradient(135deg, color-mix(in srgb, var(--accent) 18%, transparent), color-mix(in srgb, var(--magic) 18%, transparent));
  border:1px solid color-mix(in srgb, var(--accent) 30%, var(--line-2));
}
.theme-label{font-weight:600;font-size:14.5px;color:var(--fg-0);letter-spacing:.15px}
.theme-desc{margin-top:5px;font-size:12px;color:var(--fg-2);line-height:1.65}
.badge{display:inline-block;padding:1px 8px;margin-left:6px;border-radius:999px;font-size:11px;font-weight:700;
  color:#0a0f18;background:linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 60%, var(--accent-2)));
  box-shadow:0 4px 12px color-mix(in srgb, var(--accent) 25%, transparent);vertical-align:middle}

/* ===================== 断点 · 四端响应式（横竖屏 + DPR + 暗黑模式） ===================== */
/* 先做平板过渡：>1100px 双面板；≤1100 单面板堆叠 */
@media(max-width:1100px){.grid{grid-template-columns:1fr}}
@media(max-width:768px){
 .screen{padding:10px}
 .setup-card{padding:16px;margin:10px auto;border-radius:12px}
 .modal .box{padding:15px;border-radius:11px}
 .kv .k{flex:0 0 72px}
}
@media(max-width:600px){
 .screen{padding:8px}
 .big-title{letter-spacing:1px}
 .topbar{padding:8px 10px;gap:7px}
 #engstat{flex:1 1 100%;min-width:0;font-size:11.5px}
 .topbtns{flex:1 1 100%;gap:5px}
 .topbtns button{flex:1 1 0;min-width:0;padding:8px 4px;font-size:12.5px;min-height:44px}
 .panel h3{padding:9px 10px;font-size:13px;min-height:44px}
 .ptime{flex:1 1 100%;margin-left:22px;text-align:left;font-size:10.5px;margin-top:1px}
 .opt{padding:10px;gap:8px}
 .opt .txt{font-size:13px}
 .actrow{gap:7px}
 .actrow button{flex:1 1 100%}
 .modal .box{padding:13px;border-radius:10px}
 .modal h3{font-size:15px}
 .fgrid{grid-template-columns:1fr}
 .timecard{padding:12px}
 #ioBox{padding:9px}
 .cust{padding:9px 10px}
 .cust input{min-height:42px}
}
@media(max-width:480px){
 .cust-err{font-size:11px}
 body{font-size:14.5px;line-height:1.62}
 .kv{font-size:12.5px}
 /* v1.4：手机窄屏下主题卡片变单列，不再两列挤压 */
 #themeGrid{grid-template-columns:1fr}
}
/* iPhone SE / 小屏专用兜底 */
@media(max-width:380px){
 .big-title{font-size:17px}
 .timecard .big{font-size:16px}
 .topbtns button{font-size:12px;padding:8px 2px}
 .opt{padding:9px 8px}
 .opt .txt{font-size:12.5px}
}
/* iOS/鸿蒙 横屏模式（抖音直播横屏 / 平板横屏） */
@media(max-height:520px) and (orientation:landscape){
 .cust input{min-height:34px;padding:7px 9px}
 .timecard{padding:9px;margin-bottom:8px}
 .timecard .big{font-size:17px}
 .timecard .lab,.timecard .sub,.timecard .turn{display:inline;margin-right:8px}
 .panel .body{max-height:min(300px,68vh)}
 #story{max-height:min(340px,68vh)}
 .screen{padding:8px 10px}
 .setup-card{padding:14px;margin:8px auto}
 .foot{padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
}
/* 更极端横屏（旧手机 / 折叠屏外屏） */
@media(max-height:420px) and (orientation:landscape){
 .big-title{font-size:16px;margin:4px 0}
 .sub-title{margin-top:2px;margin-bottom:4px;font-size:11.5px}
 .topbar{margin-bottom:6px;padding:6px 8px}
 .timecard{padding:7px;margin-bottom:6px}
 .panel{margin-bottom:7px}
 .panel h3{padding:7px 8px;min-height:36px;font-size:12px}
 .panel .body{padding:8px 10px;max-height:min(220px,60vh)}
 #story{max-height:min(260px,60vh)}
 .opt{padding:8px;min-height:44px}
 button{min-height:44px;padding:7px 11px}
}
@media(min-width:900px){
 .ffield{max-width:none}
}
/* 高分屏（视网膜 / 2K / 4K / Windows 125% 150% 缩放）：边框线宽微调，避免 1px 变糊 */
@media(-webkit-min-device-pixel-ratio:2),(min-resolution:192dpi){
 .panel,.card,.opt,.modal .box{border-width:.5px}
 .screen,.panel,.setup-card{image-rendering:-webkit-optimize-contrast}
}
@media(-webkit-min-device-pixel-ratio:3),(min-resolution:288dpi){
 .panel,.card,.opt,.modal .box{border-width:.35px}
}
/* 无障碍：用户偏好减动画 */
@media(prefers-reduced-motion:reduce){
 .spin{animation:none}
 *{transition:none!important;animation:none!important}
 .fade-in,.fadeIn3d,.banner{animation:none!important}
}
/* 鸿蒙/微信 X5 老内核兜底：不支持 aspect-ratio/container 时退化为块级 */
@supports (contain:layout) or (container-type:inline-size){
 .grid{container-type:normal}
}
/* 深色模式兜底（系统暗黑模式开关触发时加一层柔化，避免纯白文字刺眼） */
@media(prefers-color-scheme:dark){
  /* 已是暗色主题；此处仅柔化 iOS Safari 夜间模式下的颜色反转 */
  body{filter:none;-webkit-filter:none}
}
/* 抖音/微信 WebView 横竖屏切换不缩放：加动态方向检测类占位，由 JS 控制 */
._orient_lock body{overflow:hidden;position:fixed;width:100%}
/* Windows 触控板/鼠标设备：滚动更平滑 */
@media(hover:hover) and (pointer:fine){
  .panel .body,#story{-webkit-scroll-snap-type:y proximity;scroll-snap-type:y proximity}
  .scroll-y{scroll-behavior:smooth}
}
/* 抖音/鸿蒙全屏沉浸模式专用：隐藏 iOS 底部横条提示 */
._immersive .screen{padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
._immersive .foot{display:none}

/* ============================================================
   v1.4：浅色模式（羊皮纸复古）全局 class 级颜色覆盖
   —— 之前只覆盖了"内联 style 里硬编码的颜色"，但 .panel / .opt / button / .card / .canon / input
      这些 class 里写的深色底、深蓝边框、灰蓝文字都没覆盖，所以切完视觉还是一片白配灰字糊成一团。
      这里把它们全部重映射到 --bg-* / --fg-* / --line-* 四套主题变量，浅色模式下整套 UI 都像"泛黄的漫画报纸"。
   ============================================================ */
:root[data-theme='light'] .sub-title{color:var(--fg-2)}
:root[data-theme='light'] .canon{border-color:color-mix(in srgb,var(--accent) 42%,var(--line-2));background:var(--bg-2);color:var(--fg-1)}
:root[data-theme='light'] .quote{color:var(--fg-2)}
:root[data-theme='light'] .subh{color:var(--fg-2);border-left-color:color-mix(in srgb,var(--accent) 40%,var(--line-2))}
:root[data-theme='light'] .fgrid label{color:var(--fg-2)}
:root[data-theme='light'] input,
:root[data-theme='light'] select,
:root[data-theme='light'] textarea{
  background:var(--bg-2);color:var(--fg-0);border-color:color-mix(in srgb,var(--accent) 28%,var(--line-2))}
:root[data-theme='light'] input:focus,
:root[data-theme='light'] select:focus,
:root[data-theme='light'] textarea:focus{

/* ============================================================
   作者水印（CX 原创 · 漫威模拟器）· 防盗用层
   ------------------------------------------------------------
   设计理念：
   1. 全屏淡水印 + 右下角签名 + footer 署名三重可见水印，防止截图/录屏盗用
   2. ensureWatermark() 在 renderAll / startGame / enterGame 等核心入口
      自动重建水印 DOM，即使有人手动删了也会立刻回来
   3. 导出存档自动带 _author / _copyright 字段，存档级溯源
   4. 核心函数字符串里内含签名常量，代码混淆也能搜到 CX
   ============================================================ */
.fullscreen-watermark{
  position:fixed;inset:0;z-index:1;width:100%;height:100%;pointer-events:none;
  background-repeat:repeat;background-size:280px 210px;opacity:.05;
  transform:rotate(-18deg);-webkit-transform:rotate(-18deg);
  background-image:
   url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='280' height='210'><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' font-family='Segoe UI, PingFang SC, HarmonyOS Sans, sans-serif' font-size='22' fill='%238fa3b8'>CX · 漫威模拟器</text><text x='50%' y='62%' dominant-baseline='middle' text-anchor='middle' font-size='12' fill='%236d3ef0'>作者原创</text></svg>");
  user-select:none;-webkit-user-select:none;
}
@media(prefers-color-scheme:light), (prefers-color-scheme: no-preference){
  .fullscreen-watermark{opacity:.06;background-image:
   url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='280' height='210'><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' font-family='Segoe UI, PingFang SC, sans-serif' font-size='22' fill='%230b1219'>CX · 漫威模拟器</text><text x='50%' y='62%' dominant-baseline='middle' text-anchor='middle' font-size='12' fill='%236d3ef0'>作者原创</text></svg>")}
}
@media(prefers-reduced-motion:reduce){.fullscreen-watermark{transform:none}}

.cx-badge{
  position:fixed;right:calc(10px + env(safe-area-inset-right,0px));
  bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:5;pointer-events:none;
  font-family:"Segoe UI","PingFang SC",sans-serif;
  font-weight:700;font-size:14px;line-height:1.1;letter-spacing:.5px;
  padding:7px 12px;border-radius:999px;
  background:linear-gradient(135deg,rgba(109,62,240,.85),rgba(37,179,163,.75));
  color:#fff;box-shadow:0 3px 14px rgba(109,62,240,.35);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  user-select:none;-webkit-user-select:none;
  transform:translateZ(0);-webkit-transform:translateZ(0);
}

/* ========== v1.6：新手教程引导 · 四端（iOS17B/鸿蒙4+/安卓14X5/WinEdge）最新版兼容 ==========
   iOS 17 Beta 已知 WebKit 坑：position:fixed+inset:0 在首次渲染时，若地址栏处于"收起中"的动画，
   内部 max-height 会按 100% body 高度算，按钮区会被压到视口下方 30-50px。
   解法：显式写 width/height，并且最后一道用 calc(var(--dvh)*100) —— JS 从 visualViewport.height 实时算，绝对正确。*/
.tutorial-modal{
  position:fixed !important;
  inset:0 !important;
  display:none;
  z-index:200;
  padding:0 !important;
  align-items:stretch !important;
  justify-content:center !important;
  -webkit-transform:none !important;
  transform:none !important;
  width:100% !important;
  height:100vh !important;
  height:100svh !important;
  height:100dvh !important;
  height:calc(var(--dvh, 1vh) * 100) !important;
  box-sizing:border-box !important;
}
.tutorial-modal.show{display:flex !important}
.tutorial-modal .box{
  margin:0 !important;
  height:100vh;
  height:100svh;
  height:100dvh;
  height:calc(var(--dvh,1vh)*100);
  max-height:920px;
  max-width:680px;
  width:100%;
  display:flex !important;
  flex-direction:column !important;
  padding:0 !important;
  border-radius:0 !important;
  -webkit-overflow-scrolling:touch;
  box-sizing:border-box;
  box-shadow:0 30px 90px rgba(0,0,0,.7) !important;
}
/* 桌面端宽屏：让盒子不要占满整个视口高度，带圆角更好看 */
@media(min-width:720px){
  .tutorial-modal{padding:18px !important; align-items:center !important}
  .tutorial-modal .box{
    height:auto;
    max-height:min(920px, calc(100vh - 48px));
    max-height:min(920px, calc(100dvh - 48px));
    max-height:min(920px, calc(var(--dvh,1vh) * 100 - 48px));
    border-radius:24px !important;
    overflow:hidden;
  }
}
/* hero：固定高度一段，别占用太多视口空间（移动端 14px padding 让第7步长文也能滚完）*/
.tutorial-modal .tut-hero{
  padding:16px 18px 14px;
  background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 22%,var(--bg-1)),color-mix(in srgb,var(--magic) 18%,var(--bg-0)));

}

.tutorial-modal .tut-step b{color:var(--accent);margin:0 2px}
/* tutBody：正文滚动区，手机上撑满剩余高度 */
.tutorial-modal #tutBody{
  flex:1 1 auto;
  overflow-y:auto !important;
  -webkit-overflow-scrolling:touch;
  padding:14px 18px 16px;
}
.tutorial-modal .tut-item h4{margin:0 0 10px;font-size:16.5px;color:var(--accent)}
.tutorial-modal .tut-item ul{margin:8px 0 0 18px;padding:0;color:var(--fg-0);line-height:1.85;font-size:13.5px}
.tutorial-modal .tut-item ul li{margin-bottom:3px}
.tutorial-modal .tut-item ul li::marker{color:var(--accent)}
.tutorial-modal .tut-item .tipcard{margin-top:12px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--accent) 10%,var(--bg-2));border:1px dashed color-mix(in srgb,var(--accent) 40%,var(--line-2));font-size:12.5px;line-height:1.7;color:var(--fg-1)}
.tutorial-modal .tut-item .tipcard b{color:var(--accent)}
.tutorial-modal .tut-item .emoji{font-size:30px;margin-right:8px;vertical-align:-6px}
/* dots + 按钮：永远贴底，iPhone 再小也能点到 */
.tutorial-modal .tut-dots{
  flex:0 0 auto;
  display:flex;gap:6px;justify-content:center;

/* ========== v1.4：微信/抖音/QQ 内置浏览器 → 跳转到系统默认浏览器 ========== */
.openinbrowser-mask{display:none;align-items:flex-start!important;padding:0!important;position:fixed!important;top:0!important;left:0!important;right:0!important;bottom:0!important}

/* ========== v1.4：四端（iOS/鸿蒙/安卓/Win）显示加固 ========== */
/* iPhone 灵动岛/刘海屏系列：为沉浸式 viewport-fit=cover 提供更统一的安全区避让 */
@supports(padding:max(0px)){
  body{
    padding-top:max(0px,env(safe-area-inset-top));
    padding-bottom:max(0px,env(safe-area-inset-bottom));
    padding-left:max(0px,env(safe-area-inset-left));
    padding-right:max(0px,env(safe-area-inset-right));
  }
  .screen,.setup-card{padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}
  /* 固定悬浮层：更激进的安全区适配（按钮、水印、引擎徽章都别扎进灵动感）*/
  .cx-badge,.toast,.setup-top-right{
    right:max(12px,env(safe-area-inset-right))!important;
    bottom:max(12px,env(safe-area-inset-bottom))!important;
  }
}
/* iOS Safari：禁止自动缩放到聚焦的输入框（之前 viewport 的 maximum-scale=1 对新 iOS 已无效，要加 body 级） */
@supports(-webkit-touch-callout:none){
  html,body{-webkit-text-size-adjust:100%;-moz-text-size-adjust:100%;text-size-adjust:100%}
  input,select,textarea{font-size:16px!important} /* iOS 聚焦不放大的规则：输入框字号 ≥ 16px */
  input[type="number"],input[type="date"]{font-size:16px!important}
}
/* 四端按钮：统一的 :active 触控反馈（硬加速 + 无闪烁）*/
button,.chip,.eng-tab,.opt,.skip-card,.tbtn{
  -webkit-tap-highlight-color:transparent!important;
  -webkit-user-drag:none;
  user-select:none;
  -webkit-touch-callout:none;
}
button:active,.chip:active,.eng-tab:active,.opt:active,.skip-card:active,.tbtn:active{
  -webkit-transform:scale(.97) translateZ(0)!important;
  transform:scale(.97) translateZ(0)!important;
  filter:brightness(1.06);
}
/* 模态框居中：在手机上也完美居中（之前是 flex-start，现在改成 center） */
.modal{align-items:center!important;justify-content:center!important}
.modal .box{margin:0 auto!important}
/* 安卓 X5/鸿蒙浏览器：text 渲染防糊 + 字体降级 */
html,body,div,span,p,button,input,textarea{
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
}
/* Windows 浏览器中一些老系统字体栈做美化：Segoe UI + 微软雅黑 */
@media (min-width: 900px){
  body{
    font-family:'Inter','Segoe UI Variable','Segoe UI','SF Pro Text','PingFang SC','Microsoft YaHei UI','Microsoft YaHei',HarmonyOS Sans SC,'Noto Sans CJK SC','Source Han Sans CN',sans-serif;
  }
}

/* =============== 引擎设置 · 三档模式（推荐/自定义/离线）=============== */
.eng-tabs{display:flex;gap:8px;margin:8px 0 14px;flex-wrap:wrap}
.eng-tab{flex:1 1 180px;min-width:180px;border:1px solid var(--line-2);background:var(--bg-2);border-radius:10px;
  padding:12px 12px 10px;cursor:pointer;position:relative;touch-action:manipulation;
  transition:border-color .18s,background-color .18s,transform .08s,box-shadow .18s;
  -webkit-transform:translateZ(0);transform:translateZ(0);overflow:hidden}
.eng-tab::after{content:"";position:absolute;top:-3px;left:-3px;right:-3px;bottom:-3px}
/* v1.2：hover 态明显浮起 + 各档颜色发光，让用户知道"可点" */
.eng-tab:hover{transform:translateY(-2px);-webkit-transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.35)}
.eng-tab.rec:hover{box-shadow:0 6px 18px rgba(0,0,0,.35),0 0 0 1px rgba(143,224,160,.35)}
.eng-tab.adv:hover{box-shadow:0 6px 18px rgba(0,0,0,.35),0 0 0 1px rgba(157,124,255,.38)}
.eng-tab.off:hover{box-shadow:0 6px 18px rgba(0,0,0,.35),0 0 0 1px rgba(232,198,106,.35)}
.eng-tab:active{-webkit-transform:scale3d(.97,.97,1);transform:scale3d(.97,.97,1)}
/* v1.2：active 态 — 勾选徽标 + 各档发光边，一眼就看出来选中了谁 */
.eng-tab.on{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent);
  box-shadow:0 0 0 1px rgba(232,198,106,.55),0 10px 30px rgba(232,198,106,.12);
  transform:translateY(-1px);-webkit-transform:translateY(-1px)}
.eng-tab.on::before{content:"✓ 已选";position:absolute;top:7px;right:9px;font-size:10.5px;font-weight:700;
  padding:1px 7px;border-radius:999px;letter-spacing:.3px;
  background:rgba(232,198,106,.12);color:var(--accent);border:1px solid rgba(232,198,106,.28)}
.eng-tab .emoji{font-size:20px;line-height:1;margin-right:4px}
.eng-tab .t{font-size:14px;font-weight:700;color:var(--fg-0);display:flex;align-items:center}
.eng-tab .d{font-size:11.5px;color:var(--fg-2);line-height:1.55;margin-top:4px}
.eng-tab .badge{display:inline-block;margin-top:6px;padding:2px 7px;border-radius:999px;font-size:10.5px;font-weight:600;letter-spacing:.3px}
.eng-tab.rec{border-color:color-mix(in srgb, var(--hero) 35%, var(--line-2));background:linear-gradient(180deg,rgba(18,60,40,.32),rgba(15,30,22,.2))}
.eng-tab.rec .badge{background:rgba(143,224,160,.14);color:var(--hero)}
.eng-tab.rec.on::before{color:var(--hero);background:rgba(143,224,160,.12);border-color:rgba(143,224,160,.3)}
.eng-tab.adv{border-color:color-mix(in srgb, var(--magic) 30%, var(--line-2));background:linear-gradient(180deg,rgba(50,70,140,.22),rgba(15,20,40,.15))}
.eng-tab.adv .badge{background:rgba(157,124,255,.16);color:var(--magic)}
.eng-tab.adv.on::before{color:var(--magic);background:rgba(157,124,255,.12);border-color:rgba(157,124,255,.32)}
.eng-tab.off{border-color:color-mix(in srgb, var(--accent) 35%, var(--line-2));background:linear-gradient(180deg,rgba(90,75,25,.22),rgba(30,25,10,.1))}
.eng-tab.off .badge{background:rgba(232,198,106,.15);color:var(--accent)}
.eng-pan{display:none;margin-top:4px}
/* v1.2：面板展开时淡入动效，不是突兀地跳出来 */
.eng-pan.on{display:block;animation:engPanIn .18s ease-out}
@keyframes engPanIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

/* 注册引导卡 */
.reg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:9px;margin:8px 0 2px}
.reg-card{border:1px solid var(--line-2);background:var(--bg-2);border-radius:9px;padding:10px;cursor:pointer;position:relative;touch-action:manipulation;

/* 引擎档位小标签（顶部状态栏 engstat） */

/* =============== v1.8 · 双模式系统（简易模式 / 专家模式）=============== */

/* 简易模式：巨大的「继续推进⏭️」按钮条（行动区最上方） — 用户一眼就能看到 */

.easy-go-main{flex:1;min-width:220px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:22px;font-weight:800;padding:18px 20px;border-radius:16px;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 75%,#fff 5%),color-mix(in srgb,var(--magic) 55%,#fff 5%));color:#fff;letter-spacing:.6px;box-shadow:0 6px 22px rgba(232,198,106,.22),inset 0 -2px 0 rgba(0,0,0,.08);border:none;cursor:pointer;transition:transform .12s ease, box-shadow .18s ease}
.easy-go-main:active{transform:translateY(1px) scale3d(.992,.992,1);box-shadow:0 3px 12px rgba(232,198,106,.22),inset 0 -2px 0 rgba(0,0,0,.08)}

.easy-go-side button{min-height:100%;padding:12px 14px;font-size:14px;border-radius:14px;font-weight:700}

/* 简易模式：跳过到大事件按钮直接贴在主按钮旁边，更显眼 */

/* 简易模式：顶部时间卡片里的模式徽章更显眼，用户随时知道自己现在在哪档 */

/* 简易模式：新手提示（开局前几回合，在 opts 上方加引导条，3 回合后自动隐藏）*/

/* 新手教程里的「双模式专属内容」：根据当前 body 类只显示其中一套 */

body.mode-easy .expert-show{display:none !important}
.easy-show, .expert-show{margin-top:8px;padding:10px 12px;border-radius:10px;line-height:1.7}

.expert-show{background:linear-gradient(180deg,rgba(157,124,255,.08),rgba(232,198,106,.05));border:1px dashed rgba(157,124,255,.4)}

/* 教程模式选择双卡片交互态（active） */
.tut-mode-card.active{border-color:var(--accent) !important;box-shadow:0 3px 14px rgba(232,198,106,.2);background:color-mix(in srgb,var(--accent) 8%,var(--bg-2))}

   设计参考体育生涯模拟器的 OVR 大数字：一眼看出"我现在多强"。
   8 维：💪体能 🥊格斗 🏃敏捷 🧠智力 🔬科技 ✨超能 🗣魅力 🛡意志（均 0-99）
   综评 OVR = 加权平均（超能权重 1.5），档位：凡人/受训者/精锐/义警/英雄/传奇 */
.ovr-badge{display:inline-flex;align-items:center;gap:7px;margin:0 8px 0 2px;padding:2px 11px 2px 3px;border-radius:999px;border:1px solid var(--line-2);background:color-mix(in srgb,var(--bg-2) 82%,transparent);cursor:pointer;vertical-align:middle;transition:transform .12s ease,border-color .15s ease;user-select:none}
.ovr-badge:hover{border-color:var(--accent)}

.ovr-badge .ovr-num{display:inline-flex;align-items:center;justify-content:center;min-width:36px;height:25px;padding:0 7px;border-radius:8px;font-family:Consolas,monospace;font-weight:900;font-size:15.5px;color:#fff;line-height:1;letter-spacing:.5px}
.ovr-badge .ovr-meta{display:flex;flex-direction:column;align-items:flex-start;line-height:1.25}

.ovr-t0 .ovr-num{background:linear-gradient(135deg,#7a8696,#525e6d)} .ovr-t0 .ovr-tier{color:#a8b4c2}
.ovr-t1 .ovr-num{background:linear-gradient(135deg,#63c080,#3f9456)} .ovr-t1 .ovr-tier{color:#86e0a2}
.ovr-t2 .ovr-num{background:linear-gradient(135deg,#4da8ff,#2b7fd4)} .ovr-t2 .ovr-tier{color:#86c6ff}
.ovr-t3 .ovr-num{background:linear-gradient(135deg,#b07dff,#7d4edb)} .ovr-t3 .ovr-tier{color:#cdaaff}
.ovr-t4 .ovr-num{background:linear-gradient(135deg,#f2c54d,#d4941f)} .ovr-t4 .ovr-tier{color:#f2d272}
.ovr-t5 .ovr-num{background:linear-gradient(135deg,#ff6262,#d4212b);box-shadow:0 0 12px rgba(255,90,90,.55)} .ovr-t5 .ovr-tier{color:#ff9a9a}
@media(max-width:560px){.ovr-badge{margin:4px 4px 4px 0}.ovr-badge .ovr-lab{display:none}}

/* =============== Beta v2.0 · 简易模式专属顶部信息条（生涯模拟器风格）===============
   只在 body.mode-easy 下显示；专家模式保持 v1.9 的 8 张迷你卡不变。 */
.easy-hud{display:none;margin:0 0 10px;border:1px solid var(--line-2);border-radius:17px;padding:13px 15px 11px;background:linear-gradient(180deg,color-mix(in srgb,var(--bg-2) 94%,transparent),color-mix(in srgb,var(--bg-1) 82%,transparent));box-shadow:0 4px 16px rgba(0,0,0,.16)}

.eh-bar .top{display:flex;justify-content:space-between;align-items:baseline;font-size:11.5px;color:var(--fg-2);margin-bottom:4px}

.eh-bar .tk{height:8px;border-radius:5px;background:color-mix(in srgb,var(--bg-0) 70%,#000 30%);overflow:hidden}

@media(max-width:560px){body.mode-easy #opts{grid-template-columns:1fr;gap:9px}}
body.mode-easy #opts .opt{flex-direction:column;align-items:flex-start;gap:7px;margin:0;min-height:0;padding:15px 16px 14px;border-radius:16px;border-width:1.5px;background:linear-gradient(180deg,color-mix(in srgb,var(--bg-2) 96%,transparent),color-mix(in srgb,var(--bg-1) 78%,transparent));box-shadow:0 2px 8px rgba(0,0,0,.12)}
body.mode-easy #opts .opt:hover{border-color:var(--accent);transform:translateY(-1px)}
body.mode-easy #opts .opt .tag{width:auto;height:auto;line-height:1.35;border-radius:9px;padding:3px 11px;font-size:12.5px;font-weight:900;letter-spacing:1px;margin-right:0}
body.mode-easy #opts .opt .txt{font-size:14.5px;line-height:1.6;font-weight:600;width:100%}

body.mode-easy #opts .opt.opt-a{border-color:color-mix(in srgb,#f2cf6a 45%,var(--line-2))}
body.mode-easy #opts .opt.opt-b{border-color:color-mix(in srgb,#8fe0a0 42%,var(--line-2))}
body.mode-easy #opts .opt.opt-c{border-color:color-mix(in srgb,#7cc0ff 42%,var(--line-2))}
body.mode-easy #opts .opt.opt-a .tag{background:color-mix(in srgb,#f2cf6a 18%,transparent);color:#f2d272}

body.mode-easy #opts .opt.opt-d .tag{background:color-mix(in srgb,var(--magic) 16%,transparent);color:#cdaaff;border-color:transparent}

body.mode-easy #opts .opt.opt-go{border-color:color-mix(in srgb,var(--accent) 60%,var(--line-2));background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 22%,var(--bg-2)),color-mix(in srgb,var(--magic) 14%,var(--bg-2)));justify-content:center;align-items:center;text-align:center;min-height:84px}

/* =============== Beta v2.0 · 世界日志滚动修复（双端）===============
   根因：#story 自带 max-height+overflow 滚动，外层 .panel .body 也滚动
   → 双滚动容器嵌套，外层滚到底时内层底部被 contain:paint 裁掉。
   修复：#story 不再自己滚动（自然撑高），由 #body_story 统一滚动；
   底部 padding 加大，最后一条日志永不贴边/被裁；手机端预留 iOS 虚拟 Home 条。 */
#story{
  max-height:none !important;overflow:visible !important;
  padding:14px 14px 42px;
  contain:style;
  overscroll-behavior:auto;
}
#body_story{max-height:min(640px,74vh) !important;overflow:auto !important;-webkit-overflow-scrolling:touch;padding:4px 0 44px 0}
body.mode-easy #body_story{max-height:min(580px,72vh) !important}
#body_story .entry:last-child{margin-bottom:0}
/* 手机端底部安全区 + 64px：iOS 小横条 / 安卓手势条 不盖住日志最后一句（v2.3 复核：再 + 2px 避免华为鸿蒙圆形手势条） */
@media(max-width:720px){
  #body_story{padding:4px 0 64px 0}
  #story{padding-bottom:56px}
}
@media(max-height:520px) and (orientation:landscape){
  #body_story{max-height:min(360px,70vh) !important}
}
@media(max-height:420px) and (orientation:landscape){
  #body_story{max-height:min(280px,66vh) !important}
}

/* 教程模式选择双卡片交互态（active） */

/* =============== v1.8 · 概览迷你卡 + 详情子界面（解决逐个折叠冗余） =============== */
/* v1.8：左/右栏不再是堆叠的大折叠面板，而是 2~3 行 × 2 列的「概览迷你卡」。
   每张卡：图标 + 标题 + 3~5 条关键信息 + 「详情」按钮。
   想深入看某块就点「详情」→ 弹出专属的子界面模态框（内容完整、可滚动、永不越界）。
   好处：① 一屏看完所有人生信息 ② 不用每个都点三角展开 ③ 视觉更紧凑。*/
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin:8px 0 12px}
@media (max-width:720px){.grid{grid-template-columns:1fr;gap:10px}}
.mc{position:relative;border:1px solid var(--line-2);border-radius:14px;padding:12px 13px 11px;background:linear-gradient(180deg,color-mix(in srgb,var(--bg-2) 90%,transparent),color-mix(in srgb,var(--bg-2) 70%,transparent));transition:transform .12s, box-shadow .18s, border-color .18s;contain:style paint}
.mc:hover{border-color:color-mix(in srgb,var(--accent) 55%,var(--line-2));box-shadow:0 4px 14px rgba(0,0,0,.14);transform:translateY(-1px)}
.mc .hd{display:flex;align-items:center;gap:9px;margin-bottom:8px;cursor:pointer;user-select:none}
.mc .ic{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;background:linear-gradient(135deg,color-mix(in srgb,var(--magic) 22%,transparent),color-mix(in srgb,var(--accent) 20%,transparent));flex-shrink:0}
.mc .tl{font-weight:800;font-size:14.5px;color:var(--fg-0);flex:1;line-height:1.3}
.mc .more{font-size:11.5px;font-weight:700;color:var(--accent);padding:4px 9px;border-radius:999px;border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);background:color-mix(in srgb,var(--accent) 8%,transparent);white-space:nowrap;cursor:pointer;transition:all .15s}
.mc .more:hover{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.mc .body{font-size:12.5px;line-height:1.7;color:var(--fg-1)}
.mc .kv-mini{display:grid;grid-template-columns:minmax(70px,auto) 1fr;gap:2px 10px}
.mc .kv-mini .k{color:var(--fg-2);font-weight:600}
.mc .kv-mini .v{color:var(--fg-0);word-break:break-word}
.mc .hint{margin-top:6px;font-size:11.5px;color:var(--fg-2);line-height:1.6;padding-top:6px;border-top:1px dashed color-mix(in srgb,var(--line-2) 70%,transparent)}

/* ============== v1.9 · 关系数值条（好感度 / 信任 / 敌意，0-100）============== */
.rel-row{margin:7px 0;padding:7px 9px;border-radius:9px;border:1px solid color-mix(in srgb,var(--line-2) 75%,transparent);background:color-mix(in srgb,var(--bg-2) 55%,transparent)}

.rel-bars{margin-top:6px;display:flex;flex-direction:column;gap:5px}

/* ============================================================
   Beta v2.2 · iOS 26 风格「液态玻璃 Liquid Glass」全面升级
   核心：高饱和雾化 backdrop-filter + 双层描边（内亮外暗）+
        顶部流动高光条 + 扫光 shimmer + 按压微凹。
   组件：顶栏 / 面板 / 选项卡 / chip / 模态框 / 主按钮
   深浅色自动适配：--liq-* 变量在 light 主题下有单独修正。
   ============================================================ */
:root, :root[data-theme='dark']{
  --liq-blur: 22px;
  --liq-sat: 1.65;
  --liq-inner: rgba(255,255,255,.12);       /* 内高光描边（液态顶缘）*/
  --liq-outer: rgba(255,255,255,.05);       /* 外描边（柔和）*/
  --liq-dark:  rgba(0,0,0,.28);             /* 底层暗边（玻璃下阴影）*/
  --liq-shine: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.13) 48%, rgba(255,255,255,.22) 50%, rgba(255,255,255,.10) 52%, transparent 72%);
  --liq-topbar-bg:
    linear-gradient(180deg, rgba(255,255,255,.09), rgba(255,255,255,.02) 55%, rgba(255,255,255,0) 85%),
    linear-gradient(90deg, rgba(var(--accent-rgb),.09), rgba(var(--accent-2-rgb),.06), rgba(99,102,241,.07));
  --liq-panel-bg:
    linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.03) 55%, rgba(255,255,255,0) 90%),
    linear-gradient(135deg, rgba(var(--accent-rgb),.08), rgba(var(--accent-2-rgb),.05) 50%, rgba(99,102,241,.07));
  --liq-opt-bg:
    linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.02) 55%, transparent),
    linear-gradient(135deg, rgba(var(--accent-rgb),.06), rgba(var(--accent-2-rgb),.04));
  --liq-chip-bg:
    linear-gradient(180deg, rgba(255,255,255,.09), rgba(255,255,255,.015) 60%, transparent);
  --liq-modal-bg:
    linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.02) 60%, transparent),
    linear-gradient(135deg, rgba(var(--accent-rgb),.08), rgba(var(--accent-2-rgb),.06));
}
:root[data-theme='light']{
  --liq-blur: 22px;
  --liq-sat: 1.55;
  --liq-inner: rgba(255,255,255,.75);
  --liq-outer: rgba(132,107,68,.18);
  --liq-dark:  rgba(60,42,18,.12);
  --liq-shine: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.65) 48%, rgba(255,255,255,.9) 50%, rgba(255,255,255,.5) 52%, transparent 72%);
  --liq-topbar-bg:
    linear-gradient(180deg, rgba(255,255,255,.80), rgba(255,255,255,.28) 55%, transparent 85%),
    linear-gradient(90deg, rgba(var(--accent-rgb),.08), rgba(var(--accent-2-rgb),.05));
  --liq-panel-bg:
    linear-gradient(180deg, rgba(255,255,255,.80), rgba(255,255,255,.22) 55%, transparent 90%),
    linear-gradient(135deg, rgba(var(--accent-rgb),.06), rgba(var(--accent-2-rgb),.045) 50%);
  --liq-opt-bg:
    linear-gradient(180deg, rgba(255,255,255,.70), rgba(255,255,255,.18) 55%, transparent),
    linear-gradient(135deg, rgba(var(--accent-rgb),.05), rgba(var(--accent-2-rgb),.04));
  --liq-chip-bg:
    linear-gradient(180deg, rgba(255,255,255,.70), rgba(255,255,255,.15) 60%, transparent);
  --liq-modal-bg:
    linear-gradient(180deg, rgba(255,255,255,.82), rgba(255,255,255,.22) 60%, transparent),
    linear-gradient(135deg, rgba(var(--accent-rgb),.07), rgba(var(--accent-2-rgb),.05));
}
/* ---- 液态玻璃基类（统一的饱和雾化+双层描边）---- */
.topbar, .panel, .opt, .modal .box, .chip,
body.mode-easy #opts .opt, .btn, .btn-primary, .btn-ghost{
  position:relative; isolation:isolate;
  -webkit-backdrop-filter: blur(var(--liq-blur)) saturate(var(--liq-sat));
  backdrop-filter: blur(var(--liq-blur)) saturate(var(--liq-sat));
}
/* 扫光 shimmer：用伪元素做流动高光条 */
.panel::after, .opt::before, .topbar::after, .modal .box::after,
.btn-primary::after{
  content:""; pointer-events:none; position:absolute; inset:-1px -40% auto -40%; height:34%;
  background: var(--liq-shine);
  transform: translateX(-35%) translateY(0); opacity:.0;
  transition: transform .8s ease, opacity .3s ease;
  border-radius: inherit; z-index:5; mix-blend-mode:screen;
}
:root[data-theme='light'] .panel::after,
:root[data-theme='light'] .opt::before,
:root[data-theme='light'] .topbar::after,
:root[data-theme='light'] .modal .box::after{ mix-blend-mode:soft-light; }

/* 顶部液态顶缘高光（内描边 top 亮 + bottom 暗）：用 box-shadow 双层实现，避免 border 被 filter 模糊 */
.topbar{
  background: var(--liq-topbar-bg), var(--bg-1);
  border:1px solid transparent;
  box-shadow:
    0 1px 0 var(--liq-inner) inset,        /* 内亮顶 */
    0 -1px 0 var(--liq-dark) inset,        /* 内暗底 */
    0 0 0 1px var(--liq-outer),            /* 外柔边 */
    var(--shadow-sm);
}
.topbar::after{ top:-1px; border-radius:inherit; }

/* ---- 液态玻璃 · 面板 ---- */
.panel{
  background: var(--liq-panel-bg), var(--bg-1);
  border:1px solid transparent;
  box-shadow:
    0 1px 0 var(--liq-inner) inset,
    0 -1px 0 var(--liq-dark) inset,
    0 0 0 1px var(--liq-outer),
    var(--shadow-md);
}
.panel h3{
  background:
    linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,0) 65%),
    linear-gradient(90deg, rgba(var(--accent-rgb),.12), transparent 70%),
    var(--bg-2);
}
.panel:active .h3-glow, .panel h3:active{ background: var(--bg-3); }

/* ---- 液态玻璃 · 选项卡 opt ---- */
.opt{
  background: var(--liq-opt-bg), var(--bg-2);
  border:1.5px solid transparent;
  box-shadow:
    0 1px 0 var(--liq-inner) inset,
    0 -1px 0 var(--liq-dark) inset,
    0 0 0 1px var(--liq-outer),
    var(--shadow-xs);
}
.opt::before{ /* 扫光条放在 :before，避免占用 :after 的大命中区域 */
  content:""; pointer-events:none; position:absolute; inset:-1px -40% auto -40%; height:40%;
  background: var(--liq-shine);
  transform: translateX(-40%); opacity:0;
  transition: transform .7s ease, opacity .25s ease; z-index:5; mix-blend-mode:screen; border-radius:inherit;
}
.opt:active{
  box-shadow:
    0 2px 5px var(--liq-dark) inset,            /* 微凹：内阴影 */
    0 -1px 0 var(--liq-inner) inset,
    0 0 0 1px var(--accent),
    var(--glow-accent-s);
}
@media(hover:hover) and (pointer:fine){
  .opt:hover{
    border-color:transparent;
    box-shadow:
      0 1px 0 var(--liq-inner) inset,
      0 -1px 0 var(--liq-dark) inset,
      0 0 0 1px rgba(var(--accent-rgb),.35),
      0 0 18px rgba(var(--accent-rgb),.18),
      var(--shadow-sm);
  }
  .opt:hover::before{ opacity:.9; transform:translateX(45%); }

      Array.prototype.flatMap=function(cb){return Array.prototype.flat.call(this.map(cb),1)}
    }
    /* String.prototype.padStart */
    if(!String.prototype.padStart){
      String.prototype.padStart=function(t,s){
        s=s||' ';t=t|0;var str=String(this);
        while(str.length<t)str=s+str;return str.slice(0,t)
      }
    }
    /* Object.assign 兜底（极旧内核） */
    if(!Object.assign){
      Object.assign=function(t){
        t=t||{};for(var i=1;i<arguments.length;i++){
          var s=arguments[i];if(s)for(var k in s){if(Object.prototype.hasOwnProperty.call(s,k))t[k]=s[k]}
        }return t
      }
    }
    /* Number.isNaN */
    if(!Number.isNaN){
      Number.isNaN=function(v){return typeof v==='number'&&isNaN(v)}
    }
    /* requestAnimationFrame 兜底（极旧内核） */
    if(!window.requestAnimationFrame){
      window.requestAnimationFrame=function(cb){return setTimeout(cb,16)}
      window.cancelAnimationFrame=function(id){clearTimeout(id)}
    }
    /* visualViewport 兜底：华为某些内核没有，用 innerHeight 代替 */
    if(!window.visualViewport){
      window.visualViewport={height:window.innerHeight||667,width:window.innerWidth||375,
        addEventListener:function(){},removeEventListener:function(){}}
    }
    /* fetch 兜底：用 XMLHttpRequest 模拟一个最简版 */
    if(!window.fetch){
      window.fetch=function(url,opts){
        opts=opts||{};
        return new Promise(function(resolve,reject){
          var xhr=new XMLHttpRequest();
          xhr.open(opts.method||'GET',url,true);
          var hs=opts.headers||{};for(var k in hs){if(hs[k])xhr.setRequestHeader(k,hs[k])}
          xhr.responseType='text';
          xhr.onload=function(){
            resolve({ok:xhr.status>=200&&xhr.status<300,status:xhr.status,
              text:function(){return Promise.resolve(xhr.responseText)},
              json:function(){return Promise.resolve(JSON.parse(xhr.responseText))},
              body:null})
          };
          xhr.onerror=function(){reject(new Error('Network error'))};
          xhr.ontimeout=function(){reject(new Error('Timeout'))};
          xhr.send(opts.body||null)
        })
      }
    }
    /* TextDecoder 兜底：极旧内核没有，用纯 JS decode */
    if(typeof TextDecoder==='undefined'){
      window.TextDecoder=function(){
        this.decode=function(buf){
          var s='', i;
          if(buf){ for(i=0;i<buf.length;i++){ s+=String.fromCharCode(buf[i]); } }
          try{ return decodeURIComponent(escape(s)); }catch(e){ return s; }
        };
        return this;
      };
    }
    /* AbortController 兜底 */
    if(typeof AbortController==='undefined'){
      window.AbortController=function(){this.signal={aborted:false};this.abort=function(){this.signal.aborted=true}}
    }
  }catch(_){}
})();
</script>
