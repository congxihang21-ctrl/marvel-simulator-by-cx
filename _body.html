<!-- v2.4 新增样式：种子人生玩法 -->
<style>
/* ===== 种子卡片 ===== */
.seed-card{border-radius:16px;padding:18px;margin:10px 0;cursor:pointer;transition:.25s;border:1px solid var(--bd);background:var(--panel);position:relative;overflow:hidden}
.seed-card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.25)}
.seed-card.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent),0 8px 24px rgba(0,0,0,.3)}
.seed-card .era-tag{font-size:11px;color:var(--fg-3);margin-bottom:4px}
.seed-card .era-name{font-size:17px;font-weight:700;margin-bottom:6px}
.seed-card .era-desc{font-size:13px;color:var(--fg-2);line-height:1.6;margin-bottom:10px}
.seed-card .era-meta{font-size:12px;color:var(--fg-3)}
.seed-card .era-meta span{margin-right:14px}

/* ===== 出身卡片 ===== */
.origin-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.origin-card{border-radius:14px;padding:16px;cursor:pointer;border:1px solid var(--bd);background:var(--panel);transition:.2s;text-align:center}
.origin-card:hover{transform:translateY(-2px);border-color:var(--accent)}
.origin-card.on{border-color:var(--accent);background:linear-gradient(135deg,rgba(157,124,255,.12),rgba(109,62,240,.06))}
.origin-card .ic{font-size:32px;margin-bottom:6px}
.origin-card .nm{font-weight:700;font-size:15px;margin-bottom:4px}
.origin-card .ds{font-size:11.5px;color:var(--fg-3);line-height:1.5}
.origin-card .stats-mini{margin-top:8px;font-size:11px;color:var(--fg-2)}

/* ===== 属性条（沿用v2.3风格） ===== */
.stat-row{display:flex;align-items:center;gap:10px;margin:6px 0}
.stat-row .sn{width:42px;font-size:12px;color:var(--fg-2)}
.stat-row .bar{flex:1;height:14px;border-radius:7px;background:rgba(255,255,255,.08);overflow:hidden;position:relative}
.stat-row .bar .fill{height:100%;border-radius:7px;transition:width .6s cubic-bezier(.22,1,.36,1)}
.stat-row .sv{width:32px;text-align:right;font-size:12px;font-weight:600}

/* ===== 游戏主界面 ===== */
.game-top{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:10}
.char-card{display:flex;gap:12px;align-items:center;padding:14px;background:var(--panel);border-radius:14px;margin:10px;border:1px solid var(--bd)}
.char-card .ovr-badge{width:58px;height:58px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:22px;color:#fff;flex-shrink:0}
.char-card .info{flex:1;min-width:0}
.char-card .info .name{font-weight:700;font-size:16px}
.char-card .info .sub{font-size:12px;color:var(--fg-3);margin-top:2px}
.char-card .info .stats-inline{display:flex;gap:10px;margin-top:6px;font-size:11.5px;color:var(--fg-2)}

/* ===== 时间线 ===== */
.timeline{padding:10px 14px}
.timeline .tl-item{padding:8px 12px;border-left:2px solid var(--bd);margin-left:8px;font-size:13px;color:var(--fg-2);position:relative}
.timeline .tl-item::before{content:"";position:absolute;left:-7px;top:12px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--bg)}
.timeline .tl-item.cur{border-left-color:var(--accent);font-weight:600;color:var(--fg)}
.timeline .tl-item .tl-time{font-size:11px;color:var(--fg-3)}

/* ===== 事件节点 ===== */
.event-node{padding:14px;margin:10px;border-radius:14px;background:var(--panel);border:1px solid var(--bd)}
.event-node .ev-title{font-weight:700;font-size:15px;margin-bottom:8px}
.event-node .ev-text{font-size:13.5px;line-height:1.7;color:var(--fg-2)}

/* ===== 选项卡 ===== */
.choice{display:block;width:calc(100% - 28px);margin:8px 14px;padding:14px;border-radius:12px;border:1px solid var(--bd);background:var(--panel);cursor:pointer;text-align:left;transition:.2s}
.choice:hover{border-color:var(--accent);transform:translateX(4px)}
.choice .ch-label{font-weight:600;font-size:14px;margin-bottom:4px}
.choice .ch-meta{font-size:11.5px;color:var(--fg-3)}
.choice .ch-meta .chance{color:var(--accent);font-weight:600}

/* ===== 判定动画：进度条横跳 ===== */
.judge-modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:100}
.judge-box{width:86%;max-width:400px;background:var(--panel);border-radius:18px;padding:24px;text-align:center;border:1px solid var(--bd)}
.judge-box .j-title{font-size:16px;font-weight:700;margin-bottom:6px}
.judge-box .j-stat{font-size:13px;color:var(--fg-3);margin-bottom:18px}
.judge-bar{height:28px;border-radius:14px;background:rgba(255,255,255,.08);position:relative;overflow:hidden;margin-bottom:12px}
.judge-bar .j-left{position:absolute;left:0;top:0;bottom:0;width:50%;background:linear-gradient(90deg,rgba(143,224,160,.35),rgba(143,224,160,.15))}
.judge-bar .j-right{position:absolute;right:0;top:0;bottom:0;width:50%;background:linear-gradient(270deg,rgba(255,138,138,.35),rgba(255,138,138,.15))}
.judge-bar .j-center{position:absolute;left:50%;top:0;bottom:0;width:2px;background:rgba(255,255,255,.4)}
.judge-bar .j-pointer{position:absolute;top:2px;bottom:2px;width:6px;border-radius:3px;background:#fff;box-shadow:0 0 8px rgba(255,255,255,.8);transition:left .08s linear}
.judge-bar .j-l-tag,.judge-bar .j-r-tag{position:absolute;top:50%;transform:translateY(-50%);font-size:10px;font-weight:700;z-index:2}
.judge-bar .j-l-tag{left:8px;color:#8fe0a0}
.judge-bar .j-r-tag{right:8px;color:#ff8a8a}
.judge-result{font-size:22px;font-weight:800;margin:12px 0}
.judge-result.ok{color:#8fe0a0}
.judge-result.fail{color:#ff8a8a}

/* ===== 结局模态框 ===== */
.ending-modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.ending-box{width:100%;max-width:480px;max-height:88vh;overflow-y:auto;background:var(--panel);border-radius:18px;padding:24px;border:1px solid var(--bd)}
.ending-box .e-icon{font-size:48px;text-align:center;margin-bottom:12px}
.ending-box .e-title{font-size:22px;font-weight:800;text-align:center;margin-bottom:8px}
.ending-box .e-rarity{text-align:center;font-size:12px;margin-bottom:16px}
.ending-box .e-text{font-size:14px;line-height:1.8;color:var(--fg-2);margin-bottom:16px}
.ending-box .e-achieve{padding:10px 14px;border-radius:10px;background:rgba(242,197,77,.1);border:1px dashed rgba(242,197,77,.4);font-size:13px;margin-bottom:14px}
.ending-box .e-btns{display:flex;gap:10px;justify-content:center}

/* ===== 图鉴 ===== */
.codex-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:14px}
.codex-card{border-radius:12px;padding:14px;border:1px solid var(--bd);background:var(--panel);min-height:90px}
.codex-card.locked{opacity:.5;filter:grayscale(.6)}
.codex-card .c-ic{font-size:24px;margin-bottom:4px}
.codex-card .c-title{font-weight:700;font-size:13px;margin-bottom:3px}
.codex-card .c-desc{font-size:11px;color:var(--fg-3);line-height:1.4}
.codex-card .c-rarity{font-size:10px;margin-top:4px}

/* ===== 存档槽 ===== */
.save-slot{border-radius:14px;padding:16px;margin:10px 14px;border:1px solid var(--bd);background:var(--panel);cursor:pointer;transition:.2s;display:flex;justify-content:space-between;align-items:center}
.save-slot:hover{border-color:var(--accent)}
.save-slot .s-info .s-name{font-weight:700;font-size:15px}
.save-slot .s-info .s-meta{font-size:12px;color:var(--fg-3);margin-top:3px}
.save-slot .s-empty{color:var(--fg-3);font-size:14px}
.save-slot .s-del{color:#ff8a8a;font-size:12px;padding:4px 10px;border-radius:6px;border:1px solid rgba(255,138,138,.3)}

/* ===== 全局页面切换 ===== */
.page{display:none;padding-bottom:80px}
.page.active{display:block;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* 底部导航 */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--bd);display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));z-index:50}
.bottom-nav .bn-btn{flex:1;text-align:center;font-size:11px;color:var(--fg-3);cursor:pointer;padding:4px}
.bottom-nav .bn-btn .bn-ic{font-size:20px;display:block;margin-bottom:2px}
.bottom-nav .bn-btn.on{color:var(--accent)}

/* 响应式：手机端优化 */
@media(max-width:420px){
  .origin-grid{grid-template-columns:1fr}
  .codex-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- ================= 首页 ================= -->
<div class="page active" id="pageHome">
  <div style="text-align:center;padding:40px 20px 20px">
    <div style="font-size:42px;margin-bottom:10px">🦸</div>
    <h1 style="font-size:24px;margin:0 0 6px">漫威电影宇宙·英雄纪元</h1>
    <p style="color:var(--fg-3);font-size:13px;margin:0 0 30px">凡人之躯，亦可比肩神明 · 地球-616</p>
    <button class="primary" style="width:80%;max-width:320px;padding:16px;font-size:17px;border-radius:14px" onclick="goPage('eraSelect')">🌟 开始新人生</button>
    <div style="margin-top:30px;display:flex;gap:20px;justify-content:center;font-size:13px">
      <span style="cursor:pointer;color:var(--fg-2)" onclick="goPage('codex')">📖 结局图鉴 <b id="codexProgress">0/0</b></span>
      <span style="cursor:pointer;color:var(--fg-2)" onclick="openSaveSlots()">💾 存档</span>

  <div style="position:fixed;bottom:20px;width:100%;text-align:center;font-size:11px;color:var(--fg-3)">
    © CX（高三开发组）· 非官方同人 · 漫威IP归属迪士尼/漫威
  </div>
</div>

<!-- ================= 年代选择 ================= -->
<div class="page" id="pageEraSelect">
  <div class="game-top">
    <span style="font-size:18px;font-weight:700">🕰️ 选择你的时代</span>
    <span style="cursor:pointer;font-size:20px" onclick="goPage('home')">←</span>
  </div>
  <div style="padding:10px 14px">
    <p style="font-size:13px;color:var(--fg-2);margin-bottom:10px">每个时代都有独特的正典大事件和英雄传说。你将以一个普通人的身份，在这个时代书写属于自己的故事。</p>
  </div>
  <div id="eraList"></div>
</div>

<!-- ================= 出身选择 ================= -->
<div class="page" id="pageOriginSelect">
  <div class="game-top">
    <span style="font-size:18px;font-weight:700">🎭 选择你的出身</span>
    <span style="cursor:pointer;font-size:20px" onclick="goPage('eraSelect')">←</span>
  </div>
  <div style="padding:10px 14px">
    <p style="font-size:13px;color:var(--fg-2);margin-bottom:10px" id="originEraHint"></p>
    <div class="origin-grid" id="originList"></div>
  </div>
</div>

<!-- ================= 属性预览 ================= -->
<div class="page" id="pageAttrPreview">
  <div class="game-top">
    <span style="font-size:18px;font-weight:700">📊 你的初始属性</span>
    <span style="cursor:pointer;font-size:20px" onclick="goPage('originSelect')">←</span>
  </div>
  <div style="padding:14px">
    <div class="char-card">
      <div class="ovr-badge" id="ovrBadge" style="background:linear-gradient(135deg,#9d7cff,#6d3ef0)">
        <span id="ovrNum" style="font-size:22px">0</span>
        <span style="font-size:9px">OVR</span>
      </div>
      <div class="info">
        <div class="name" id="charNameDisplay">无名者</div>
        <div class="sub" id="charOriginDisplay">—</div>
      </div>
    </div>
    <div style="margin:16px 0">
      <label style="font-size:13px;color:var(--fg-2)">给自己起个名字：</label>
      <input id="charNameInput" placeholder="留空由系统生成" style="width:100%;padding:10px;margin-top:6px;border-radius:10px;border:1px solid var(--bd);background:var(--panel);color:var(--fg)" maxlength="12">
    </div>
    <div id="statBars"></div>
    <button class="primary" style="width:100%;padding:14px;margin-top:20px;border-radius:12px;font-size:16px" onclick="startGame()">⚔ 确认，进入战场</button>
  </div>
</div>

<!-- ================= 游戏主界面 ================= -->
<div class="page" id="pageGame">
  <div class="game-top">
    <span id="gameEraTag" style="font-weight:700">二战·1943</span>
    <div style="display:flex;gap:12px;font-size:16px">
      <span style="cursor:pointer" onclick="goPage('codex')">📖</span>
      <span style="cursor:pointer" onclick="openSaveSlots()">💾</span>

  <div id="choices"></div>
</div>

<!-- ================= 图鉴 ================= -->
<div class="page" id="pageCodex">
  <div class="game-top">
    <span style="font-size:18px;font-weight:700">📖 结局图鉴</span>
    <span style="cursor:pointer;font-size:20px" onclick="goPage(gameState?'game':'home')">←</span>
  </div>
  <div style="padding:14px">
    <div class="tabs" style="display:flex;gap:8px;margin-bottom:10px">

      <button class="tab" id="tabAchievements" onclick="switchCodexTab('achievements')">成就</button>
    </div>

  <div class="codex-grid" id="codexGrid"></div>
</div>

<!-- ================= 存档槽 ================= -->
<div class="modal" id="saveModal" style="display:none">
  <div class="box" style="max-width:480px">
    <h3>💾 存档槽</h3>
    <div id="saveSlotList"></div>

</div>

<!-- ================= 判定动画 ================= -->

      <div class="j-right"></div>

      <span class="j-r-tag">失败</span>

    <div class="judge-result" id="jResult"></div>
  </div>
</div>

<!-- ================= 结局展示 ================= -->

  <div class="ending-box">
    <div class="e-icon" id="eIcon">🏆</div>
    <div class="e-title" id="eTitle">结局</div>
    <div class="e-rarity" id="eRarity"></div>

    <div class="e-achieve" id="eAchieve" style="display:none"></div>

<script>
